name: Rust

on: [push, pull_request] # note: pre-release job still only on 'refs/heads/main'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: no-unsafe
            features: "--features no-unsafe"
    name: Build and Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Build (${{ matrix.name }})
      run: cargo build ${{ matrix.features }} --verbose
    - name: Run tests (${{ matrix.name }})
      run: cargo test ${{ matrix.features }} --verbose

  clippy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: no-unsafe
            features: "--features no-unsafe"
    name: Clippy/Lint check (${{ matrix.name }})
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: run clippy (${{ matrix.name }})
      run: cargo clippy ${{ matrix.features }}

  zip-rules:
    name: zip up the rules directory
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Remove empty Rules directories
      run: find Rules -type d -empty -delete
    - name: Remove test directory
      run: rm -r Rules/Languages/zz
    - name: create Rules.zip
      run: zip -r Rules.zip Rules
    - name: Upload Rules.zip
      uses: actions/upload-artifact@v7
      with:
        name: 'Rules.zip'
        path: 'Rules.zip'
        compression-level: 0
        retention-days: 1

  pre-release:
    name: Pre Release
    continue-on-error: false
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # otherwise, job fails on pull requests, as GITHUB_TOKEN is not available
    needs: [build, clippy, zip-rules]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: download Rules.zip
      uses: actions/download-artifact@v8
      with:
        name: Rules.zip
    # Moving 'latest' prerelease (replaces marvinpinto/action-automatic-releases)
    - name: Development Build release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        REPO="${{ github.repository }}"
        SHA="${{ github.sha }}"
        # No checkout in this job — always pass --repo.
        gh release delete latest --repo "$REPO" --yes --cleanup-tag || true
        gh api --method DELETE "repos/${REPO}/git/refs/tags/latest" || true
        gh release create latest \
          --repo "$REPO" \
          --target "$SHA" \
          --prerelease \
          --latest=false \
          --title "Development Build" \
          --notes "Development build from ${SHA}" \
          Rules.zip
