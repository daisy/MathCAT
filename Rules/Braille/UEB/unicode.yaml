 # Latin capitals: chem-element letters use 𝐶 (no word indicator); others use C.
 # Cells come from lowercase a-z via spell/translate.
 - "BCHIKNOPSUVWY":              # chemistry-capable capitals
    - test:
        if: "@data-chem-element"
        then: [tc: "𝐶"]
        else: [tc: "C"]
    - spell: "translate('.', 'BCHIKNOPSUVWY', 'bchiknopsuvwy')"
 - "ADEFGJLMQRTXZ":              # remaining capitals
    - tc: "C"
    - spell: "translate('.', 'ADEFGJLMQRTXZ', 'adefgjlmqrtxz')"

