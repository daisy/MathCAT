---
# UEB characters
#
# Some chars that originally came from an Excel spreadsheet, converted to csv, and the greatly expanded
# 
# The UEB translation makes use of some non-braille chars as flags
#    L -- what follows is a letter
#    N -- what follows is a digit
#    C -- precedes L for capital letters
#    G -- precedes L for Greek Letters (after C for capitals)
#  Typeface Indicators ("typeforms")
#    B bold, I Italic, S Sans-serif, T script, D, Fraktur, 𝔹 blackboard-bold
#    the type face indicators can be combined with B (first) and I (second)
#  Standing alone chars:
#    Any character which acts as a standing alone character (e.g, "{") needs each braille symbol to be labeled
#    o -- opening/left side, c -- closing/right side, b -- both open and close (e.g, '"')

 - "0": [t: "N⠚"]               # 0x30 
 - "1": [t: "N⠁"]               # 0x31 
 - "2": [t: "N⠃"]               # 0x32 
 - "3": [t: "N⠉"]               # 0x33 
 - "4": [t: "N⠙"]               # 0x34 
 - "5": [t: "N⠑"]               # 0x35 
 - "6": [t: "N⠋"]               # 0x36 
 - "7": [t: "N⠛"]               # 0x37 
 - "8": [t: "N⠓"]               # 0x38 
 - "9": [t: "N⠊"]               # 0x39 

# we stick the drop numbers into the private use area for consistency
 - "\ue000": [t: "N⠴"]               # 0 
 - "\ue001": [t: "N⠂"]               # 1 
 - "\ue002": [t: "N⠆"]               # 2 
 - "\ue003": [t: "N⠒"]               # 3 
 - "\ue004": [t: "N⠲"]               # 4 
 - "\ue005": [t: "N⠢"]               # 5 
 - "\ue006": [t: "N⠖"]               # 6 
 - "\ue007": [t: "N⠶"]               # 7 
 - "\ue008": [t: "N⠦"]               # 8 
 - "\ue009": [t: "N⠔"]               # 9 

# we stick hex digits into the private use area for consistency
# these are used when we don't want to add a numeric indicator for subsequent digits (3.3)
 - "\ue00A": [t: "N⠐N⠁"]               # A 
 - "\ue00B": [t: "N⠐N⠃"]               # B 
 - "\ue00C": [t: "N⠐N⠉"]               # C 
 - "\ue00D": [t: "N⠐N⠙"]               # D 
 - "\ue00E": [t: "N⠐N⠑"]               # E 
 - "\ue00F": [t: "N⠐N⠋"]               # F 

# leave room for the rest of the alphabet
 - "\ue01A": [t: "N⠨N⠁"]               # A 
 - "\ue01B": [t: "N⠨N⠃"]               # B 
 - "\ue01C": [t: "N⠨N⠉"]               # C 
 - "\ue01D": [t: "N⠨N⠙"]               # D 
 - "\ue01E": [t: "N⠨N⠑"]               # E 
 - "\ue01F": [t: "N⠨N⠋"]               # F 

# Omission char -- there isn't a specific code point, so we use a private use area
 - "\ue020": [t: "⠰"]        # omission (three dot 5s with letter indicator) 


 - "a": [t: "L⠁"]               # 0x61 
 - "b": [t: "L⠃"]               # 0x62 
 - "c": [t: "L⠉"]               # 0x63 
 - "d": [t: "L⠙"]               # 0x64 
 - "e": [t: "L⠑"]               # 0x65 
 - "f": [t: "L⠋"]               # 0x66 
 - "g": [t: "L⠛"]               # 0x67 
 - "h": [t: "L⠓"]               # 0x68 
 - "i": [t: "L⠊"]               # 0x69 
 - "j": [t: "L⠚"]               # 0x6a 
 - "k": [t: "L⠅"]               # 0x6b 
 - "l": [t: "L⠇"]               # 0x6c 
 - "m": [t: "L⠍"]               # 0x6d 
 - "n": [t: "L⠝"]               # 0x6e 
 - "o":                         # 0x6f 
    - test:     # special case because these have the same dot pattern
        if: "preceding-sibling::*[1][self::m:mo and (.='>' or .='≫')]"
        then: [t: "⠐"]
    - t: "L⠕"
 - "p": [t: "L⠏"]               # 0x70 
 - "q": [t: "L⠟"]               # 0x71 
 - "r": [t: "L⠗"]               # 0x72 
 - "s": [t: "L⠎"]               # 0x73 
 - "t": [t: "L⠞"]               # 0x74 
 - "u": [t: "L⠥"]               # 0x75 
 - "v": [t: "L⠧"]               # 0x76 
 - "w": [t: "L⠺"]               # 0x77 
 - "x": [t: "L⠭"]               # 0x78 
 - "y": [t: "L⠽"]               # 0x79 
 - "z": [t: "L⠵"]               # 0x7a 


 - "á": [t: "L⠷"]               # 0xE1 
 - "é": [t: "L⠮"]               # 0xE9 
 - "í": [t: "L⠌"]               # 0xED 
 - "ñ": [t: "L⠻"]               # 0xF1 
 - "ó": [t: "L⠬"]               # 0xF3 
 - "ú": [t: "L⠾"]               # 0xFA 
 - "ü": [t: "L⠳"]               # 0xFC 

 - "Á": [t: "CL⠷"]               # 0xC0 
 - "É": [t: "CL⠮"]               # 0xC9 
 - "Í": [t: "CL⠌"]               # 0xCD 
 - "Ñ": [t: "CL⠻"]               # 0xD1 
 - "Ó": [t: "CL⠬"]               # 0xD3 
 - "Û": [t: "CL⠾"]               # 0xDA 
 - "Ü": [t: "CL⠳"]               # 0xDC 

 - "A": [t: "CL⠁"]              # 0x41 
 - "B":                         # 0x42 
    - test:
        if: "@data-chem-element"
        then: [t: "𝐶L⠃"]
        else: [t: "CL⠃"]
 - "C":                         # 0x43 
    - test:
        if: "@data-chem-element"
        then: [t: "𝐶L⠉"]
        else: [t: "CL⠉"]
 - "D": [t: "CL⠙"]              # 0x44 
 - "E": [t: "CL⠑"]              # 0x45 
 - "F": [t: "CL⠋"]              # 0x46 
 - "G": [t: "CL⠛"]              # 0x47 
 - "H":                         # 0x48 
    - test:
        if: "@data-chem-element"
        then: [t: "𝐶L⠓"]
        else: [t: "CL⠓"]
 - "I":                         # 0x49 
    - test:
        if: "@data-chem-element"
        then: [t: "𝐶L⠊"]
        else: [t: "CL⠊"]
 - "J": [t: "CL⠚"]              # 0x4a 
 - "K":                         # 0x4b 
    - test:
        if: "@data-chem-element"
        then: [t: "𝐶L⠅"]
        else: [t: "CL⠅"]
 - "L": [t: "CL⠇"]              # 0x4c 
 - "M": [t: "CL⠍"]              # 0x4d 
 - "N":                         # 0x4e 
    - test:
        if: "@data-chem-element"
        then: [t: "𝐶L⠝"]
        else: [t: "CL⠝"]
 - "O":                         # 0x4f 
    - test:
        if: "@data-chem-element"
        then: [t: "𝐶L⠕"]
        else: [t: "CL⠕"]
 - "P":                         # 0x50 
    - test:
        if: "@data-chem-element"
        then: [t: "𝐶L⠏"]
        else: [t: "CL⠏"]
 - "Q": [t: "CL⠟"]              # 0x51 
 - "R": [t: "CL⠗"]              # 0x52 
 - "S":                         # 0x53 
    - test:
        if: "@data-chem-element"
        then: [t: "𝐶L⠎"]
        else: [t: "CL⠎"]
 - "T": [t: "CL⠞"]              # 0x54 
 - "U":                         # 0x55 
    - test:
        if: "@data-chem-element"
        then: [t: "𝐶L⠥"]
        else: [t: "CL⠥"]
 - "V":                         # 0x56 
    - test:
        if: "@data-chem-element"
        then: [t: "𝐶L⠧"]
        else: [t: "CL⠧"]
 - "W":                         # 0x57 
