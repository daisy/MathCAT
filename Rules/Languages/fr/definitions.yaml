---
- include: "../../definitions.yaml"

# French overrides for language-dependent speech definitions. Anything omitted
# here continues to fall back to the shared English defaults.

# IntentMappings Syntax:
#
# This section defines how each "intent" is spoken for various grammatical forms (fixities such as "prefix", "infix", "postfix", and "function"),
#  along with supporting different verbosity levels.
# The syntax is a little bit complicated, but allows a declarative syntax so you don't have to write as many rules.
#
# For each intent, you specify spoken forms for one or more fixities using the syntax below.
#
# - Each mapping has the form:
#     "<intent>": "<fixity1>=<speech1> || <fixity2>=<speech2> || ...",
#   Every alternative must name a fixity and use "="; the fixity requested when speaking selects one.
#
# - Separate multiple fixities with "||". Spaces are allowed around any delimiter for readability.
# - Within a speech string, "|" selects the verbosity form:
#     - one "|"  (two forms):   the first is 'terse', the second is used for 'medium' and 'verbose'
#     - two "|"  (three forms): 'terse', 'medium', 'verbose', in that order
#     - no "|":                 the same spoken form is used for all verbosity levels
#
# - Use semicolons ";" to divide opening; main; closing bracketing words within the name part,
#   where such words make sense (a name with no ";" is just the main phrase).
# - If an intent has multiple fixities but a definition does not specify one, the first fixity listed is chosen by default.
#
# Functions and argument glue (the part after the name):
# - ":" separates the name/bracketing phrase from the argument-glue options that follow it.
# - Arity template (two or more ":" options, or one option with ','-separated glue words): the
#   number of glue words implies the arity, and the final argument is preceded by "of".
#   Example: "sum: over: from,to"
#      - 1 arg:  "sum of x"
#      - 2 args: "sum over i of x"
#      - 3 args: "sum from i to n of x"
#   If no option matches the argument count, the arguments are separated with "comma".
# - Binary separator (exactly one ":" option, no commas in it): after "of", that word joins the two args.
#   Example: "quotient": "function=integer part: divided by" → "integer part of x divided by y"
#   If there are not exactly two args, the arguments fall back to "comma".
# - Paired "ratio-style" ("<name> : <glue> | <name2> : <glue2> | ..."): used when every "|"-separated
#   piece is a single "name : glue" pair. Verbosity selects one pair, whose glue is the binary
#   separator described above. Example: "ratio": "function=ratio : to | the ratio : to | the ratio : to"
#
# Conceptual grammar (with precedence):
#
#   IntentMappingsEntry ::= <intent> ":" <intent_speech>          # ":" is the YAML key/value separator
#
#   <intent_speech> ::= <fixity_speech> ( "||" <fixity_speech> )*
#
#   <fixity_speech> ::= <fixity> "=" <fixity_body>
#
#   <fixity> ::= "prefix" | "infix" | "postfix" | "function" | "nofix" | "silent"
#
#   <fixity_body> ::= <standard_body> | <paired_body>
#
#   # Standard form: a name/bracketing part, then ":"-separated argument-glue options.
#   <standard_body> ::= <speech_part> ( ":" <arg_glue> )*
#
#   <speech_part> ::= <segment> [ ";" <segment> ";" <segment> ]   # 1 part: name; 3 parts: opening; main; closing
#
#   <segment>  ::= <word> [ "|" <word> [ "|" <word> ] ]           # terse | medium | verbose
#
#   <arg_glue> ::= <segment>                                      # a single glue word, or ","-separated arity words
#
#   # Paired "ratio-style" form: recognized only when every "|" piece is a single "name : glue" pair.
#   <paired_body> ::= <pair> ( "|" <pair> )+
#
#   <pair> ::= <word> ":" <word>                                 # the glue <word> contains no ":"
#
#   <word> ::= text
#
# Precedence depends on the form:
#   - Standard: split on ":" first (name vs. argument-glue options), then split each piece on "|"
#     for terse|medium|verbose, and split only the name part on ";" for opening; main; closing.
#   - Paired: split on "|" first into "name : glue" pairs, then verbosity selects one pair.
#
# Example:
#   "absolute-value": "function= ; absolute value| the absolute value| the absolute value; end absolute value"
#   "sum": "function=sum: over: from,to"
#   "quotient": "function=integer part: divided by"
#   "ratio": "function=ratio : to | the ratio : to | the ratio : to"  # verbosity of name:glue pairs
#
- IntentMappings: {
    "indexed-by": "infix= ; indice; fin d'indice| fin d'indice| fin d'indice",
    "modified-variable": "silent= ",
    "say-super": "infix=super| exposant| exposant",
    "skip-super": "silent=",

    "absolute-value": "function= ; valeur absolue| la valeur absolue| la valeur absolue; fin de valeur absolue",
    "binomial": "infix=binôme; parmi; fin du binôme",
    "dimension-product": "infix=par",
    "greatest-common-divisor": "function=pgcd| le pgcd| le plus grand commun diviseur",
    "imaginary-part": "function=partie imaginaire| la partie imaginaire| la partie imaginaire",
    "least-common-multiple": "function=ppcm| le ppcm| le plus petit commun multiple",
    "limit": "prefix=limite quand| la limite quand| la limite quand",
    "lim-sup": "prefix=lim sup quand| la limite supérieure quand| la limite supérieure quand",
    "lim-inf": "prefix=lim inf quand| la limite inférieure quand| la limite inférieure quand",
    "logarithm-with-base": "prefix=log en base| le log en base| le log en base",
    "natural-logarithm": "function=l n| logarithme naturel| logarithme naturel",
    "minus": "infix=moins || prefix=moins",
    "plus": "infix=plus || prefix=positif",
    "real-part": "function=la partie réelle",

    "transpose": "postfix=transposée || function=transposée",
    "norm": "function= ; norme| norme| la norme de; fin de norme",
    "trace": "function= ; trace | trace| la trace de; fin de trace",
    "dimension": "function= ; dimension | dimension| la dimension de; fin de dimension",
    "homomorphism": "function= ; homomorphisme | homomorphisme| l'homomorphisme de; fin de l'homomorphisme",
    "kernel": "function= ; noyau | noyau| le noyau de; fin du noyau",
    "vector": "function= ; vecteur || prefix=vecteur",
    "cross-product": "infix=croix| produit vectoriel| produit vectoriel",
    "dot-product": "infix=point| produit scalaire| point| produit scalaire",

    "divergence": "function= ; div| divergence| divergence; fin de divergence",
    "curl": "function= ; rotationnel| rotationnel| rotationnel; fin du rotationnel",
    "gradient": "function= ; grad| gradient| gradient; fin de gradient",
    "laplacian": "function=laplacien",

    "chemistry-concentration": "function= ; concentration| concentration de| la concentration de; fin de concentration",

    "set-of-integers": "nofix=ℤ| ensemble des nombres entiers",
    "set-of-reals": "nofix=ℝ| ensemble des nombres réels",
    "set-of-rationals": "nofix=ℚ| ensemble des nombres rationnels",
    "set-of-natural-numbers": "nofix=ℕ| ensemble des nombres entiers naturels",
    "set-of-complex-numbers": "nofix=ℂ| ensemble des nombres complexes",
    "set-of-primes": "nofix=ℙ| ensemble des nombres premiers",
  }

# Names of functions that in terse mode don't say "of" (or it's equivalent in other languages)
- TerseFunctionNames: {
    "divergence", "gradient", "curl"
  }

# These are the parts of a formula that can be navigated to
- NavigationParts: {
    "large-op": "base; borne inférieure; borne supérieure",
    "mfrac": "numérateur; dénominateur",
    "fraction": "numérateur; dénominateur",
    "msqrt": "racine",
    "square-root": "racine",
    "mroot": "racine; indice de racine",
    "root": "racine; indice de racine",
    "msub": "base; indice",
    "sub": "base; indice",
    "logarithm-with-base": "base",
    "indexed-by": "base; indice",
    "msup": "base; exposant",
    "say-super": "base; exposant",
    "skip-super": "base; exposant",
    "power": "base; exposant",
    "msubsup": "base; indice; exposant",
    "munder": "base; borne inférieure",
    "mover": "base; borne supérieure",
    "munderover": "base; borne inférieure; borne supérieure",

    # words for moving into and out of one of the parts (e.g., "move right 'out of' numerator, 'in' denominator")
    # it's a hack to put them here, but at least they are grouped with the other navigation parts
    "in": "dans",
    "out": "hors de",
  }

# =============================================================================
# Units and currency
# =============================================================================
# Spoken names for measures come from these maps. Keys are the MathML leaf text
# (symbol or abbreviation); values are the spoken *singular* base word.
#
# Lookup order for a unit token (speech rules / canonicalize):
#   1. SIUnits
#   2. UnitsWithoutPrefixes
#   3. EnglishUnits   (English-only; leave empty in other languages)
#   4. SIPrefixes + SIUnits  (e.g. "km" → "kilo" + "metre"; "da" is two letters)
# Currency symbols use CurrencySymbols (e.g. "$" → "dollar").
#
# Once the singular base word is known, speech uses UnitNumber(.) to choose
# singular vs plural (one / few / many), then PluralForms (or PluralDefaultFromEnding /
# PluralSpellingDefaultSuffix) when it is not "one". For "1" before a unit or currency,
# languages with gender may also consult UnitGender / OneBeforeUnit (see Gender
# below). English has no gender agreement, so "1" is spoken normally.
#
# --- Singular vs plural (one / few / many) ---
# PluralSystem (see Rules/definitions.yaml) selects how integers map to one/few/many:
#   - one_many      — 1 → "one", anything else → "many"   (English default; inherited)
#   - one_few_many  — 1 → "one"; 2–4 (except 12–14) → "few"; else "many"  (pl, ru, …)
# UnitNumber(node) returns that value for a unit/currency leaf, then applies compound
# position from CompoundUnitPlural / NumberlessUnitPlural (Rules/definitions.yaml):
#   - last (default) — last counted-side factor takes the category (en, …)
#   - first           — first counted-side factor (es, pt)
#   - all             — every factor, including the "per" side (fr)
#   - none            — every factor stays "one" after a numeral (hu with a number)
# NumberlessUnitPlural is used when there is no mn coefficient (m/s, x ms); "same"
# (default) reuses CompoundUnitPlural. Hungarian sets NumberlessUnitPlural to last
# so an uncounted head can be plural while counted forms stay singular. Languages
# that need per-word exceptions (de/nl) or a different case/form without a number
# (fi partitive vs nominative; pl/ru genitive vs nominative) stay on the defaults —
# these two keys alone cannot express those shifts.
# A real count of one forces every factor to "one". Per-side factors with no local
# count stay "one" unless the active policy is all.
# Speech rules typically:
#   UnitNumber = "one"  → speak the singular base word from the unit/currency map
#   otherwise           → PluralForms[base word] if listed, else PluralDefaultFromEnding /
#                         PluralSpellingDefaultSuffix (English: empty ByFinal + suffix "s")
# Irregulars and words that stay the same in the plural go in PluralForms below
# (keyed by the *spoken singular* base word, not the symbol). Languages with
# one_few_many often also have PluralGenitive (or similar) for "many".
#
# Examples (English, PluralSystem one_many):
#   UnitNumber = "one" (singular base word as spoken):
#     1 m   → "1 metre"     (SIUnits "m" → "metre")
#     $1    → "1 dollar"    (CurrencySymbols "$" → "dollar")
#   UnitNumber ≠ "one" (plural form):
#     3 m   → "3 metres"    (no PluralForms entry → default append "s")
#     3 ft  → "3 feet"      (PluralForms "foot" → "feet")
#
# --- Gender (numeral–noun agreement for "1") ---
# Gender attaches to the spoken singular base word (after SIUnits / CurrencySymbols
# resolution), not to the symbol. Exception lists must only contain base words that
# already appear as *values* in SIUnits / UnitsWithoutPrefixes / EnglishUnits /
# CurrencySymbols (or the language’s equivalents)—not a general dictionary.
#
# GenderSystem (vec, like PluralSystem) chooses the default policy:
#   - none            — no gender; UnitGender returns "" (English, zh, ja, …)
#   - ending          — last letter of the last token via GenderDefaultFromEnding,
#                       else GenderDefault (es, pt, …)
#   - neuter_list     — common unless the *symbol* is in NeuterUnits /
#                       NeuterUnitsWithoutPrefixes / CurrencySymbolsNeuter (nb, sv)
#   - explicit_only   — GenderDefault unless listed in exception maps (de, fr, …)
# Omit GenderSystem or use ["none"] when unused. Empty exception maps are fine.
#
# Ending map + default (for GenderSystem ending / as fallback for explicit_only):
#   GenderDefaultFromEnding: { "a": "feminine" }   # final letter → gender
#   GenderDefault: ["masculine"]
#
# Exception lists (spoken base words only), as needed per language:
#   FeminineUnitWords / MasculineUnitWords / NeuterUnitWords
#   FeminineCurrencyWords / MasculineCurrencyWords / NeuterCurrencyWords
# Multiword base words ("degree celsius", "atomic mass unit"): gender uses the last
# token’s ending unless the full base word is listed as an exception.
#
# How to speak "1" before the unit/currency (when gender is used):
#   OneBeforeUnit: { "masculine": "un", "feminine": "una", "neuter": "ett", "common": "en" }
# Missing key or GenderSystem none → fall back to normal number speech ("1" / NumbersOnes).
#
# Examples (Spanish-style GenderSystem ending + OneBeforeUnit un/una):
#   Common case (GenderDefaultFromEnding / GenderDefault):
#     1 m  → "metro" ends in "o" → not in map → GenderDefault masculine → "un metro"
#     1 cd → "candela" ends in "a" → feminine → "una candela"
#   Exception (listed override; "día" ends in "a" but is masculine):
#     MasculineUnitWords includes "día" → "un día"  (not "una día")
#
# --- Default plural spelling (when PluralForms has no entry) ---
#   PluralDefaultFromEnding: { "r": "es", "l": "es" }  # final letter → suffix
#   PluralSpellingDefaultSuffix: ["s"]               # otherwise append this
# Example (Spanish): "dólar" → "dólares"; "metro" → "metros"; "gray" → "grays".
# Irregulars stay in PluralForms ("lumen" → "lúmenes").
#
# English: GenderSystem is none; do not add OneBeforeUnit or gender exception lists
# unless agreement is intentionally introduced later. Plural spelling inherits
# PluralSpellingDefaultSuffix "s" with an empty PluralDefaultFromEnding map.
# =============================================================================

- SIPrefixes: {
    "Q": "quetta", "R": "ronna", "Y": "yotta", "Z": "zetta", "E": "exa", "P": "peta", "T": "tera", "G": "giga",
    "M": "mega", "k": "kilo", "h": "hecto", "da": "déca", "d": "déci", "c": "centi", "m": "milli", "µ": "micro",
    "n": "nano", "p": "pico", "f": "femto", "a": "atto", "z": "zepto", "y": "yocto", "r": "ronto", "q": "quecto"
  }

