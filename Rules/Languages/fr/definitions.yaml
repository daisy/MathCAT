# French: every factor of a compound unit is plural, including the “per” side.
- CompoundUnitPlural: ["all"]

# Currency symbol → spoken singular base word. Same UnitNumber / PluralForms path as units.
# French gender for “1” before units: explicit lists only (no ending default).
# Leave OneBeforeUnit empty until FeminineUnitWords / MasculineUnitWords are filled;
# UnitGender returns listed genders, else GenderDefault.
- GenderSystem: ["explicit_only"]
- GenderDefault: ["masculine"]
- FeminineUnitWords: {
  }
- MasculineUnitWords: {
  }
- FeminineCurrencyWords: {
  }
- MasculineCurrencyWords: {
