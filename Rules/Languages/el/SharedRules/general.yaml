- name: log    # handle both log and ln (if in an mrow, 'intents' are used)
  tag: mi
  match: ".='log' or .='ln'"
  replace:
  - bookmark: "@id"
   # theodora. rule for accusative after an operator e.g. "ισούται με"
  - with:
      variables: [IsAccusative: "ancestor::m:mrow[1]/preceding-sibling::*[1][self::m:mo and (.='=' or .='<' or .='>' or .='≤' or .='≥' or .='≰' or .='≱' or .='≮' or .='≯' or .='≝' or .='≡' or .='≃' or .='≄' or .='≅' or .='≆' or .='≇' or .='≈' or .='≉' or .='≊' or .='≢' or .='≨' or .='≩' or .='≞' or .='≪' or .='≫' or .='⫹' or .='⫺' or .='≼' or .='≽' or .='⋠' or .='⋡' or .='∷' or .='∺' or .='≍' or .='≎' or .='≑' or .='≓' or .='≘' or .='≟' or .='≣' or .='≭' or .='≳' or .='≲' or .='⋦' or .='⋧' or .='⋨' or .='⋩' or .='⟚' or .='⩰' or .='⪬' or .='⪭' or .='⪵' or .='⪶' or .='⪷' or .='⪸' or .='⪹' or .='⪺' or .='≶' or .='≷' or .='≸' or .='≹' or .='⋘' or .='⋙' or .='⋚' or .='⋛' or .='⋜' or .='⋝' or .='⋞' or .='⋟' or .='⪝' or .='⪞' or .='⪙' or .='⪚' or .='⪛' or .='⪜' or .='⪡' or .='⪢' or .='⪤' or .='⪥' or .='⪪' or .='⪫' or .='⫷' or .='⫸')]"]
      replace:
      - test:
          if: "$Verbosity!='Terse'"
          then:
          - test:
              if: "$IsAccusative"
              then: [t: "το"]   #theodora. "το" για να πιάνει και το φυσικό λογάριθμο
              else: [t: "ο"]
      - test:
        - if: ".='log'"
          then:
          - test:
            - if: "$IsAccusative"
              then: [t: "λογάριθμο"]
              else: [t: "λογάριθμος"]
        - else:
          - test:
            - if: "$Verbosity='Terse'"
              then: [spell: "'ln'"]
            - else_if: "$IsAccusative"
              then: [t: "φυσικό λογάριθμο"]
              else: [t: "φυσικός λογάριθμος"]
