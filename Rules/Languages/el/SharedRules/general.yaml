- name: bigop-both
  tag: large-op
  match: "count(*) = 3"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then: [t: ""]      # phrase('the' square root of 25 equals 5)
  - x: "*[1]"
  - t: "από"      # phrase(subtracting 5 'from' 10 gives 5)
  - x: "*[2]"
  - t: "ως"      # phrase(adding 6 'to' 6 equals  12)
  - x: "*[3]"
  - test:
      if: "following-sibling::*"
      then: [t: "του"]      # phrase(the square root 'of' 25 equals 5)

- name: bigop-under
  tag: large-op
  match: "count(*)=2"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then: [t: ""]      # phrase('the' square root of 25 equals 5)
  - x: "*[1]"
  - test:
    - if: "*[1][.='∫'] and *[2][self::m:mrow]"
      then: [t: "για"]
    - else_if: "*[1][.='∫']"  
      then: [t: "επί του συνόλου"]
    - else:
      - t: "για"
  - x: "*[2]"
  - test:
      if: "following-sibling::*"
      then: [t: "του"]      # phrase(the square root 'of' 25 equals 5)

- name: largeop
  tag: mrow
  match: "count(*)=2 and IsInDefinition(*[1], 'LargeOperators')"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then: [t: ""]      # phrase('the' square root of 25 equals 5) #theodora. in greek "the" is depended on the following word and syntax of the sentence. it is better to leave it blank where multiple cases are needed. 
  - x: "*[1]"
  - t: "του"      # phrase(the square root 'of' 25 equals 5)
  - x: "*[2]"

