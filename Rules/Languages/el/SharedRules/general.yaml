- name: permutation
#  tag: permutation-symbol
  # Not a default because the order of the args is reversed
  tag: pochhammer
  match: "count(*)=2 and contains(@data-intent-property, ':infix:')"
  replace:
  - x: "*[2]"
  - t: "μεταθέσεις των"      # phrase(the solution  involves several 'permutations of' values)
  - x: "*[1]"

- name: intervals
  tag: [open-interval, open-closed-interval, closed-interval, closed-open-interval]
  match: "count(*)=2"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then:
      - t: "το"      # phrase('the' square root of 25 equals 5)
  #- x: "translate(name(.),'-', ' ')"   
  #theodora. the following lines are translations for intervals.
  - test:
       - if: "name(.)='closed-interval'"
         then:  
         - t: "κλειστό διάστημα"
       - else_if: "name(.)='open-interval'"
         then:
         - t: "ανοιχτό διάστημα"
       - else_if: "name(.)='open-closed-interval'"
         then:
         - t: "ανοιχτό κλειστό διάστημα"
       - else_if: "name(.)='closed-open-interval'"
         then:
         - t: "κλειστό ανοιχτό διάστημα"
 
  - test:
      if: "$Verbosity!='Terse'"
      then:
      - t: "από"      # phrase(subtracting 5 'from' 10 gives 5)
      - x: "*[1]"
      - t: "ως"      # phrase(adding 6 'to' 6 equals  12)
      - x: "*[2]"
      else:
      - x: "*[1]"
      - t: "κόμμα"      # phrase(use a 'comma' to divide large numbers or as a decimal point)
      - x: "*[2]"

- name: default-point
  tag: point
  match: "count(*)=2"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then:
      - t: ""      # phrase('the' square root of 25 equals 5)  #theodora. better leave it blank for now because "the" is context depended in greek and i am not sure what is referring to here.
  - t: "τελεία"      # phrase(a decimal 'point' indicates the fraction component of a number) #theodora. a lot of issues occur in greek with points and commas in numbers.
  - x: "*[1]"
  - t: "κόμμα"      # phrase(use a 'comma' to divide large numbers or as a decimal point) 
  - x: "*[2]"

