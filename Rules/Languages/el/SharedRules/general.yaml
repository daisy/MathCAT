- name: real-part
  tag: real-part
  match: "."
  replace:
  - bookmark: "@id"
  - t: "πραγματικό μέρος"      # phrase('the real part' of a complex number does not include the imaginary part)

- name: imaginary-part
  tag: imaginary-part
  match: "."
  replace:
  - bookmark: "@id"
  - t: "φανταστικό μέρος"      # phrase('the imaginary part' is part of a complex number)

# rules on scripted vertical bars ('evaluated at')
- name: evaluated-at-2
  tag: evaluate
  match: "count(*)=2"
  replace:
  - x: "*[1]"
  - pause: auto
  - t: "υπολογισμένο για"      # phrase(results were 'evaluated at' a given point) 
  - pause: auto
  - x: "*[2]"

- name: evaluated-at-3
  tag: evaluate
  match: "count(*)=3"
  replace:
  - x: "*[1]"
  - pause: auto
  - t: "υπολογισμένο για"      # phrase(results were 'evaluated at' this point)
  - pause: auto
  - x: "*[3]"
  - t: "μείον την ίδια έκφραση υπολογισμένη στο"      # phrase(this result is 'minus the same expression evaluated at' an earlier point)
  - x: "*[2]"

