---

- name: line-segment
  tag: line-segment
  match: "count(*)=2"
  replace:
  - test:
      if: "$Verbosity='Verbose'"
      then:
      - t: "ευθύγραμμο τμήμα από"      # phrase('the line segment from' A to B)
      - x: "*[1]"
      - t: "ως"                         # phrase(the line segment from A 'to' B)
      - x: "*[2]"
      else:
      - t: "ευθύγραμμο τμήμα"               # phrase(the 'line segment' A  B)
      - x: "*[1]"
      - x: "*[2]"

- name: geometry-ray
  tag: ray
  match: "count(*)=2"
  replace:
  - test:
      if: "$Verbosity='Verbose'"
      then:
      - t: "το διάνυσμα από"             # phrase('the ray from' A to B)
      - x: "*[1]"
      - t: "σε"                       # phrase(the ray from A 'to' B)
      - x: "*[2]"
      else:
      - t: "διάνυσμα"                      # phrase(the 'ray'A  B)
      - x: "*[1]"
      - x: "*[2]"

- name: geometry-arc
  tag: arc
  match: "count(*)=2"
  replace:
  - test:
      if: "$Verbosity='Verbose'"
      then: [t: "το"]            # phrase('the' arc A B C)
  - t: "τόξο"                        # phrase(the 'arc' A B C)
  - x: "*[1]"
  - x: "*[2]"

- name: measure-of-angle
  tag: measure-of-angle
  match: "count(*)=3"
  replace:
  - test:
      if: "$Verbosity='Verbose'"
      then:
      - t: "το μέτρο της γωνίας"      # phrase('the measure of the angle' ABC)
      else:
      - t: "μέτρο γωνίας"      # phrase('measure of angle' ABC)
  - x: "*[1]"
  - x: "*[2]"
  - x: "*[3]"

#new
- name: coordinate
  tag: coordinate
  match: "."
  replace:
  - test:
      if: "$Verbosity='Verbose'"
      then: [t: "το"]      # phrase('the' point at 1, 2)
  - t: "σημείο"      # phrase(the 'point' at 1, 2)
  - test:
      if: "$Verbosity='Verbose'"
      then: [t: "στο"]      # phrase('the' point at 1, 2)
  - pause: short
  - insert:
      nodes: "*"
      replace: [t: "κόμμα", pause: auto]      # phrase(f of x 'comma' y)
  - pause: short
  - test:
      if: "($SpeechStyle='ClearSpeak' and $Verbosity='Verbose') or not(IsNode(*[last()],'leaf'))"
      then: [t: "τέλος σημείου"]      # phrase(start point, 'end point')
