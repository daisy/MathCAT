---

- name: line-segment
  tag: line-segment
  match: "count(*)=2"
  replace:
  - test:
      if: "$Verbosity='Verbose'"
      then:
      - T: "線分"      # phrase('the line segment from' A to B)
      - x: "*[1]"
      - T: "から"                         # phrase(the line segment from A 'to' B)
      - x: "*[2]"
      - T: "まで"                         # phrase(the line segment from A to B)
      else:
      - T: "線分"               # phrase(the 'line segment' A  B)
      - x: "*[1]"
      - x: "*[2]"

- name: geometry-ray
  tag: ray
  match: "count(*)=2"
  replace:
  - test:
      if: "$Verbosity='Verbose'"
      then:
      - T: "半直線"             # phrase('the ray from' A to B)
      - x: "*[1]"
      - T: "を始点として"           # phrase(the ray 'from' A to B) -- A is the endpoint
      - x: "*[2]"
      - T: "を通る"                   # phrase(the ray from A 'to' B) -- it passes through B, it does not stop there
      else:
      - T: "半直線"                      # phrase(the 'ray'A  B)
      - x: "*[1]"
      - x: "*[2]"

- name: geometry-arc
  tag: arc
  match: "count(*)=2"
  replace:
  - test:
      if: "$Verbosity='Verbose'"
      then: [ot: ""]            # phrase('the' arc A B C)
  - T: "弧"                        # phrase(the 'arc' A B C)
  - x: "*[1]"
  - x: "*[2]"

- name: measure-of-angle
  tag: measure-of-angle
  match: "count(*)=3"
  replace:
  - test:
      if: "$Verbosity='Verbose'"
      then:
      - T: "角"      # phrase('the measure of the angle' ABC)
      else:
      - T: "角"      # phrase('measure of angle' ABC)
  - x: "*[1]"
  - x: "*[2]"
  - x: "*[3]"
  - T: "の大きさ"      # Japanese says the angle first: 角 ABC の大きさ

# The angle-measure intent: definitions.yaml can only give it as a prefix (角の大きさ A),
# which keeps the English order, so say it here the same way as measure-of-angle.
- name: angle-measure
  tag: angle-measure
  # angle-measure:silent($x) says only $x; leave it to the silent-intent rule
  match: "count(*)>0 and not(contains(@data-intent-property, ':silent:'))"
  replace:
  - test:
      # the operand already says 角 for m∠ABC or an angle intent; don't say it twice
      if: "not(*[1][(self::m:angle and not(contains(@data-intent-property, ':silent:'))) or (self::m:mrow and *[1][self::m:mo and .='∠'])])"
      then: [T: "角"]      # phrase('measure of angle' ABC)
  - x: "*"
  - T: "の大きさ"      # Japanese says the angle first: 角 A の大きさ


- name: coordinate
  tag: coordinate
  # Intent forms coordinate($x,...) use @arg and fall through to function-intent / IntentMappings
  match: "not(*[@arg])"
  replace:
  - test:
      if: "$Verbosity='Verbose'"
      then: [ot: ""]      # phrase('the' point at 1, 2)
  - T: "点"      # phrase(the 'point' at 1, 2)
  - test:
      if: "$Verbosity='Verbose'"
      then: [T: "の座標"]      # phrase('the' point at 1, 2)
  - pause: short
  - insert:
      nodes: "*"
      replace: [T: "コンマ", pause: auto]      # phrase(f of x 'comma' y)
  - pause: short
  - test:
      if: "($SpeechStyle='ClearSpeak' and $Verbosity='Verbose') or not(IsNode(*[last()],'leaf'))"
      then: [T: "点終了"]      # phrase(start point, 'end point')
