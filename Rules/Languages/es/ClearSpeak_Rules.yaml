---
- name: pause
  tag: "!*"
  match: "not(self::m:math) and not($MatchingPause) and @data-intent-property[contains(., ':pause')]"
  replace:
   - with:
      variables: [MatchingPause: "true()"]
      replace:
      - test:
        - if: "contains(@data-intent-property, ':pause-long')"
          then: [pause: long]
        - else_if: "contains(@data-intent-property, ':pause-short')"
          then: [pause: short]
          else: [pause: medium]
      - x: "."

- name: intent-literal-silent
  tag: [mi, mo, mn]
  match: "contains(@data-intent-property, ':silent:')"
  # say nothing
  replace: []

# handling of negative numbers that come from 'intent' is hard -- we do something that is close to right here 

- name: intent-literal-negative-number
  tag: mn
  match: "starts-with(text(), '-')"
  replace:
  - T: "menos"      # phrase(10 'minus' 4 equals 6)
  - x: "translate(text(), '-_', '')"

- name: default
  tag: square-root
  match: "."
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then: [OT: "la"]      # phrase('la' raíz cuadrada de 25)
  - T: "raíz cuadrada"      # phrase(8 es la 'raíz cuadrada' de 64)
  - test:
      if: "$ClearSpeak_Roots = 'PosNegSqRoot' or $ClearSpeak_Roots = 'PosNegSqRootEnd'"
      then:
      - test:
          if: "parent::*[(self::m:minus or self::m:plus) and count(*)=1]"
          then: [bookmark: "parent/@id"]
      - test:
          if: "parent::m:minus"
          then: [T: "negativa"]      # phrase(la raíz cuadrada 'negativa' de 4)
          else: [T: "positiva"]      # phrase(la raíz cuadrada 'positiva' de 4)
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: "de"]      # phrase(la raíz cuadrada 'de' 5)
      else: [pause: short]
  - x: "*[1]"
  - test:
      if: "$ClearSpeak_Roots = 'RootEnd' or $ClearSpeak_Roots = 'PosNegSqRootEnd'"
      then:
      - pause: short
      - T: "fin de raíz"      # phrase(la raíz quinta de x 'fin de raíz')
      - pause: medium
      else_test:
        if: "IsNode(*[1], 'simple')"
        then: [pause: short]
        else: [pause: long]

- name: default
  tag: root
  match: "."
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then: [OT: "la"]      # phrase(6 es 'la' raíz cuadrada de 36)
  - T: "raíz"        # phrase(la 'raíz' quinta de x)
  - test:
      if: "*[2][self::m:mn and not(contains(., '.'))]"
      then_test:
      - if: "*[2][.='2']"
        then: [T: "cuadrada"]        # phrase(la raíz 'cuadrada' de x)
      - else_if: "*[2][.='3']"
        then: [T: "cúbica"]        # phrase(la raíz 'cúbica' de x)
      - else_if: "DefinitionValue(*[2], 'Speech', 'OrdinalesFemeninos') != ''"
        then: [x: "DefinitionValue(*[2], 'Speech', 'OrdinalesFemeninos')"]      # phrase(la raíz 'quinta' de x)
      - else: [T: "de índice", x: "*[2]"]      # phrase(la raíz 'de índice' 21 de x)
      else_test:
        if: "*[2][self::m:mi][string-length(.)=1]"
        then_test:
          if: "*[2][.='n' or .='𝑛']"
          then: [T: "enésima"]      # phrase(la raíz 'enésima' de x), como el CMU
          else: [x: "*[2]", CT: "-ésima"]      # phrase(la raíz m'-ésima' de x)
        else: [T: "de índice", x: "*[2]"]      # phrase(la raíz 'de índice' n más 1 de x)
  - test:
      if: "$ClearSpeak_Roots = 'PosNegSqRoot' or $ClearSpeak_Roots = 'PosNegSqRootEnd'"
      then:
      - test:
          if: "parent::*[(self::m:minus or self::m:plus) and count(*)=1]"
          then: [bookmark: "parent/@id"]
      - test:
          if: "parent::m:minus"
          then: [T: "negativa"]      # phrase(la raíz cuadrada 'negativa' de 4)
          else: [T: "positiva"]      # phrase(la raíz cuadrada 'positiva' de 4)
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: "de"]      # phrase(la raíz cuadrada 'de' 36)
  - x: "*[1]"
  - test:
      if: "$ClearSpeak_Roots = 'RootEnd' or $ClearSpeak_Roots = 'PosNegSqRootEnd'"
      then:
      - pause: short
      - T: "fin de raíz"      # phrase(la raíz quinta de x 'fin de raíz')
      - pause: medium
      else_test:
        if: "IsNode(*[1], 'simple')"
        then: [pause: short]
        else: [pause: long]

- name: signo-de-numero-entre-parentesis
  # el signo de (−2) o (+1) se dice después del número: "2 negativo", "1 positivo"
  tag: [plus, minus]
  match:
  - "$Verbosity='Verbose' and"
  - "count(*)=1 and *[1][self::m:mn] and contains(@data-intent-property, ':prefix:') and"
  - "parent::m:mrow[count(*)=3 and *[1][.='('] and *[3][.=')']] and"
  - "not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')])"
  replace:
  - bookmark: "@id"
  - x: "*[1]"
  - test:
      if: "self::m:minus"
      then: [T: "negativo"]      # phrase(2 'negativo' más 1 positivo)
      else: [T: "positivo"]      # phrase(2 negativo más 1 'positivo')

# The 'negative' rule interacts with the msqrt/mroot rules as those might pick off this case ("the negative square root of x")
- name: negative_and_positive
  tag: [plus, minus]
  match: "count(*)=1 and contains(@data-intent-property, ':prefix:')"
  replace:
  - test:
      if:
      - "*[1][self::m:square-root or self::m:root] and"
      - "($ClearSpeak_Roots = 'PosNegSqRoot' or $ClearSpeak_Roots = 'PosNegSqRootEnd')"
      then: [T: ""]
      else:
      - bookmark: "@id"
      - test:
          if: "self::m:minus"
          then: [T: "menos"]      # phrase('menos' 5)
          else: [T: "más"]      # phrase('más' 7)
  - x: "*[1]"

- name: derivada
  # dy/dx, d²y/dx² (CMU): "la derivada (segunda) de y respecto de x"
  tag: fraction
  match:
  - "not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')]) and"
  - "*[1][self::m:mrow][count(*)=3][*[2]='⁢'] and *[2][self::m:mrow][count(*)=3][*[2]='⁢'] and"
  - "*[2]/*[1][self::m:mi][.='d' or .='𝑑' or .='ⅆ'] and"
  - "( (*[1]/*[1][self::m:mi][.='d' or .='𝑑' or .='ⅆ'] and *[2]/*[3][self::m:mi]) or"
  - "  (*[1]/*[1][self::m:msup or self::m:power][*[1][self::m:mi][.='d' or .='𝑑' or .='ⅆ']] and *[2]/*[3][self::m:msup or self::m:power][*[1][self::m:mi]] and *[1]/*[1]/*[2] = *[2]/*[3]/*[2]) )"
  variables:
  - Orden: "*[1]/*[1][self::m:msup or self::m:power]/*[2]"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: "la"]      # phrase('la' derivada de y respecto de x)
  - T: "derivada"      # phrase(la 'derivada' de y respecto de x)
  - test:
    - if: "$Orden = 2"
      then: [T: "segunda"]      # phrase(la derivada 'segunda' de y respecto de x)
    - else_if: "$Orden = 3"
      then: [T: "tercera"]      # phrase(la derivada 'tercera' de y respecto de x)
    - else_if: "$Orden = 4"
      then: [T: "cuarta"]      # phrase(la derivada 'cuarta' de y respecto de x)
    - else_if: "$Orden[self::m:mi][.='n' or .='𝑛']"
      then: [T: "enésima"]      # phrase(la derivada 'enésima' de y respecto de x)
    - else_if: "$Orden"
      then: [T: "de orden", x: "$Orden"]      # phrase(la derivada 'de orden' n de y respecto de x)
  - T: "de"      # phrase(la derivada 'de' y respecto de x)
  - x: "*[1]/*[3]"
  - T: "respecto de"      # phrase(la derivada de y 'respecto de' x)
  - test:
      if: "$Orden"
      then: [x: "*[2]/*[3]/*[1]"]
      else: [x: "*[2]/*[3]"]

- name: derivada-parcial
  # ∂f/∂x, ∂²f/∂x² (CMU): "la derivada parcial (segunda) de f respecto de x"
  tag: fraction
  match:
  - "not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')]) and"
  - "*[1][self::m:mrow][count(*)=2 or count(*)=3 and *[2]='\u2062'] and *[2][self::m:mrow][count(*)=2 or count(*)=3 and *[2]='\u2062'] and *[2]/*[1][.='∂' or .='𝜕'] and"
  - "( (*[1]/*[1][.='∂' or .='𝜕'] and *[2]/*[last()][self::m:mi]) or"
  - "  (*[1]/*[1][self::m:msup or self::m:power][*[1][.='∂' or .='𝜕']] and *[2]/*[last()][self::m:msup or self::m:power][*[1][self::m:mi]] and *[1]/*[1]/*[2] = *[2]/*[last()]/*[2]) )"
  variables:
  - Orden: "*[1]/*[1][self::m:msup or self::m:power]/*[2]"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: "la"]      # phrase('la' derivada parcial de f respecto de x)
  - T: "derivada parcial"      # phrase(la 'derivada parcial' de f respecto de x)
  - test:
    - if: "$Orden = 2"
      then: [T: "segunda"]      # phrase(la derivada 'segunda' de y respecto de x)
    - else_if: "$Orden = 3"
      then: [T: "tercera"]      # phrase(la derivada 'tercera' de y respecto de x)
    - else_if: "$Orden = 4"
      then: [T: "cuarta"]      # phrase(la derivada 'cuarta' de y respecto de x)
    - else_if: "$Orden[self::m:mi][.='n' or .='𝑛']"
      then: [T: "enésima"]      # phrase(la derivada 'enésima' de y respecto de x)
    - else_if: "$Orden"
      then: [T: "de orden", x: "$Orden"]      # phrase(la derivada 'de orden' n de y respecto de x)
  - T: "de"      # phrase(la derivada parcial 'de' f respecto de x)
  - x: "*[1]/*[last()]"
  - T: "respecto de"      # phrase(la derivada parcial de f 'respecto de' x)
  - test:
      if: "$Orden"
      then: [x: "*[2]/*[last()]/*[1]"]
      else: [x: "*[2]/*[last()]"]

- name: per-fraction
  tag: fraction
  match:
  - "$ClearSpeak_Fractions='Per' or"
  - "(BaseNode(*[1])[contains(@data-intent-property, ':unit') or"
  - "                ( self::m:mrow and count(*)=3 and"  # maybe a bit paranoid checking the structure...
  - "                 *[1][self::m:mn] and *[2][.='\u2062'] and BaseNode(*[3])[contains(@data-intent-property, ':unit')] ) ] and"
  - " BaseNode(*[2])[contains(@data-intent-property, ':unit')] )"
  replace:
  - x: "*[1]"
  - T: "por"      # phrase('5 meters 'per' second)
  - x: "*[2]"

- name: common-fraction
  tag: fraction
  match:
  - "($ClearSpeak_Fractions='Auto' or $ClearSpeak_Fractions='Ordinal' or $ClearSpeak_Fractions='EndFrac') and"
  - "*[1][self::m:mn][not(contains(., $DecimalSeparators)) and ($ClearSpeak_Fractions='Ordinal' or text()<20)]   and"
  - "*[2][self::m:mn][not(contains(., $DecimalSeparators)) and ($ClearSpeak_Fractions='Ordinal' or (2<= text() and text()<=10))]"
  variables: [IsPlural: "*[1]!=1"]
  replace:
  - test:
      if: "*[1][.='1']"
      then: [T: "un"]      # phrase('un' medio)
      else: [x: "*[1]"]
  - x: "ToOrdinal(*[2], true(), $IsPlural)"   # extra args specify fractional ordinal and whether it is plural

- name: fraction-over-simple
  tag: fraction
  match:
  - "($ClearSpeak_Fractions='Over' or $ClearSpeak_Fractions='FracOver' or $ClearSpeak_Fractions='OverEndFrac') or"
  - "( not($ClearSpeak_Fractions='General' or $ClearSpeak_Fractions='GeneralEndFrac') and"
  - "  (IsNode(*[1],'simple') and IsNode(*[2],'simple')) )" # simple fraction in ClearSpeak spec
  replace:
  - test:
      if: "$ClearSpeak_Fractions='FracOver'"
      then:
      - test:
          if: "$Verbosity!='Terse'"
          then: [OT: "la"]
      - T: "fracción"      # phrase(the 'fraction' with 3 over 4)
  - x: "*[1]"
  - T: "partido por"      # phrase(the fraction 3 'over' 4)
  - x: "*[2]"
  - test:
      # very ugly!!! -- replicate nested ordinal fraction as they are an exception
      if: "$ClearSpeak_Fractions='OverEndFrac' or ($ClearSpeak_Fractions='EndFrac' and not( ($ClearSpeak_Fractions='Auto' or $ClearSpeak_Fractions='Ordinal' or $ClearSpeak_Fractions='EndFrac') and *[1][*[1][self::m:mn][not(contains(., '.')) and ($ClearSpeak_Fractions='Ordinal' or text()<20)]   and *[2][self::m:mn][not(contains(., '.')) and ($ClearSpeak_Fractions='Ordinal' or (2<= text() and text()<=10))] ] and *[2][*[1][self::m:mn][not(contains(., '.')) and ($ClearSpeak_Fractions='Ordinal' or text()<20)]   and *[2][self::m:mn][not(contains(., '.')) and ($ClearSpeak_Fractions='Ordinal' or (2<= text() and text()<=10))] ] ) )"
      then:
      - pause: short
      - T: "fin de fracción"      # phrase(7 over 8 'end fraction')
      - pause: short

- # fraction with text or numbers followed by text in both numerator and denominator
  name: fraction-over-text
  tag: fraction
  match:
  - "not($ClearSpeak_Fractions='General' or $ClearSpeak_Fractions='GeneralEndFrac') and"
  - "( "
  - "  ((*[1][self::m:mi or self::m:mtext][string-length(.)>1]) or " # fractions with text
  - "   (*[1][self::m:mrow][count(*)=3][ "
  - "        *[1][self::m:mn] and "
  - "        *[2][self::m:mo][.='⁢'] and " # invisible times
  - "        *[3][self::m:mi or self::m:mtext][string-length(.)>1] ]) ) and"
  - "  ((*[2][self::m:mi or self::m:mtext][string-length(.)>1]) or " # fractions with text
  - "   (*[2][self::m:mrow][count(*)=3][ "
  - "        *[1][self::m:mn] and "
  - "        *[2][self::m:mo][.='⁢'] and " # invisible times
  - "        *[3][self::m:mi or self::m:mtext][string-length(.)>1] ]) )"
  - ")"
  replace:
  - x: "*[1]"
  - T: "partido por"      # phrase(the fraction 3 'over' 4)
  - x: "*[2]"
  - test:
      if: "$ClearSpeak_Fractions='EndFrac' or $ClearSpeak_Fractions='OverEndFrac'"
      then:
      - pause: short
      - T: "fin de fracción"      # phrase(7 over 8 'end fraction')
      - pause: short

- name: default
  tag: fraction
  match: "."
  replace:
  - OT: "la"      # phrase(5 is 'the' square toot of 25)
  - T: "fracción con numerador"      # phrase(the 'fraction with numerator' 6)
  - test:
      if: "not(IsNode(*[1], 'simple'))"
      then: [pause: medium]
  - x: "*[1]"
  - pause: medium
  - T: "y denominador"      # phrase(the fraction with numerator 5 'and denominator' 8)
  - x: "*[2]"
  - pause: long
  - test:
      if: "$ClearSpeak_Fractions='EndFrac' or $ClearSpeak_Fractions='GeneralEndFrac'"
      then:
      - pause: short
      - T: "fin de fracción"      # phrase(the fraction with 3 over 4 'end fraction')
      - pause: short

# rules for functions raised to a power
# these could have been written on 'mrow' but putting them on msup seems more specific
# to see if it is a function, we look right to see if the following sibling is apply-function

# rules for functions raised to a power
# these could have been written on 'mrow' but putting them on msup seems more specific
# to see if it is a function, we look right to see if the following sibling is apply-function
- name: ClearSpeak-function-inverse
  tag: inverse-function
  match: "."
  replace:
  # en español el adjetivo va después y concuerda: "seno inverso", "tangente inversa",
  # así que TrigInverse y Auto se leen igual
  - test:
      if: "$ClearSpeak_Trig = 'ArcTrig'"
      then: [bookmark: "*[2]/@id", T: "arco", x: "*[1]"]      # phrase('arco' seno de x)
      else:
      - x: "*[1]"
      - bookmark: "*[2]/@id"
      - test:
          if: "*[1][.='sin' or .='sen' or .='cos' or .='sinh' or .='senh' or .='cosh' or .='log' or .='ln']"
          then: [T: "inverso"]     # phrase(seno 'inverso')
          else: [T: "inversa"]     # phrase(tangente 'inversa')

- name: function-squared-or-cubed
  tag: power
  match:
  - "*[2][self::m:mn][.='2' or .='3'] and"
  - "following-sibling::*[1][self::m:mo][.='⁡']" #invisible function apply
  replace:
  - x: "*[1]"
  - bookmark: "*[2]/@id"
  - test:
      if: "*[2][.='2']"
      then: [T: "al cuadrado"]      # phrase(seno 'al cuadrado' de x)
      else: [T: "al cubo"]      # phrase(seno 'al cubo' de x)

- name: function-power
  # "la quinta potencia de seno de x"; desde 11, "la potencia 21 de seno de x"
  tag: power
  match:
  - "following-sibling::*[1][self::m:mo][.='⁡']" #invisible function apply
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then: [OT: "la"]      # phrase('la' tercera potencia de 2)
  - bookmark: "*[2]/@id"
  - test:
      if: "DefinitionValue(*[2], 'Speech', 'OrdinalesFemeninos') != ''"
      then: [x: "DefinitionValue(*[2], 'Speech', 'OrdinalesFemeninos')", T: "potencia de"]      # phrase(la tercera 'potencia de' 6)
      else: [T: "potencia", x: "*[2]", T: "de"]      # phrase(la 'potencia' 21 'de' 6)
  - pause: short
  - x: "*[1]"

- name: AfterPower-nested
  tag: power
  match: # directly a superscript or an mrow that contains a superscript
  - "$ClearSpeak_Exponents = 'AfterPower' and"
  - "*[2][self::m:power or self::m:power or self::m:mrow[m:power]]"
  replace:
  - x: "*[1]"
  - T: "elevado al exponente"      # phrase(5 'elevado al exponente' x más 1)
  - pause: short
  - x: "*[2]"
  - pause: short
  - T: "fin de exponente"      # phrase(5 elevado al exponente x más 1 'fin de exponente')

- name: AfterPower-default
  tag: power
  match: "$ClearSpeak_Exponents = 'AfterPower'"
  replace:
  - x: "*[1]"
  - T: "elevado a la potencia"      # phrase(x 'elevado a la potencia' 4)
  - x: "*[2]"
  - pause: short

- name: squared
  tag: power
  match: "*[2][self::m:mn][.='2'] and $ClearSpeak_Exponents = 'Auto'"
  replace:
  - x: "*[1]"
  - bookmark: "*[2]/@id"
  - T: "al cuadrado"      # phrase(7 'al cuadrado' es 49)

- name: cubed
  tag: power
  match: "*[2][self::m:mn][.='3'] and $ClearSpeak_Exponents = 'Auto'"
  replace:
  - x: "*[1]"
  - bookmark: "*[2]/@id"
  - T: "al cubo"      # phrase(5 'al cubo' es 125)

- name: simple-integer
  # "x a la quinta potencia" hasta 10; desde 11, "x elevado a 21"
  tag: power
  match: "*[2][self::m:mn][not(contains(., '.'))]"
  replace:
  - x: "*[1]"
  - test:
      if: "DefinitionValue(*[2], 'Speech', 'OrdinalesFemeninos') != ''"
      then:
      - T: "a la"      # phrase(2 'a la' séptima potencia)
      - x: "DefinitionValue(*[2], 'Speech', 'OrdinalesFemeninos')"
      - test:
          if: "$ClearSpeak_Exponents != 'Ordinal'"
          then: [T: "potencia"]      # phrase(2 a la séptima 'potencia')
      else: [T: "elevado a", x: "*[2]"]      # phrase(2 'elevado a' 21)

- name: simple-negative-integer
  tag: power
  match:
  - "*[2][self::m:minus and count(*)=1 and "
  - "     *[1][self::m:mn][not(contains(., '.'))]"
  - "    ]"
  replace:
  - x: "*[1]"
  - T: "elevado a"      # phrase(2 'elevado a' menos 7)
  - x: "*[2]"

- name: simple-var
  tag: power
  match: "*[2][self::m:mi][string-length(.)=1]"
  replace:
  - x: "*[1]"
  - T: "elevado a"      # phrase(3 'elevado a' n)
  - x: "*[2]"

- # [xxx]^n
  name: nested-squared-or-cubed
  tag: power
  match:
  - "$ClearSpeak_Exponents = 'Auto' and"
  - "*[2][self::m:power]["
  - "     *[2][self::m:mn][.='2' or .='3'] and " # exp is 2 or 3
  # base is mn, mi, common fraction ([xxx] case)
  - "     *[1][self::m:mn or self::m:mi or "
  - "          self::m:fraction[*[1][self::m:mn][not(contains(., '.')) and text()<20]   and"
  - "                        *[2][self::m:mn][not(contains(., '.')) and 2<= text() and text()<=10]]"
  - "         ]"
  - "    ]"
  replace:
  - x: "*[1]"
  - T: "elevado a"      # phrase(x 'elevado a' y al cuadrado)
  - x: "*[2]"

- # - [xxx]^n
  name: nested-negative-squared-or-cubed
  tag: power
  match:
  - "$ClearSpeak_Exponents = 'Auto' and"
  - " *[2][self::m:minus and count(*)=1 and "
  - "      *[1]/*[1][self::m:power]["
  - "                *[2][self::m:mn][.='2' or .='3'] and " # exp is 2 or 3"
  # base is mn, mi, common fraction ([xxx] case)
  - "                *[1][self::m:mn or self::m:mi or "
  - "                     self::m:fraction[*[1][self::m:mn][not(contains(., '.')) and text()<20]   and"
  - "                                   *[2][self::m:mn][not(contains(., '.')) and 2<= text() and text()<=10]]"
  - "               ]"
  - "          ]"
  - "     ]"
  replace:
  - x: "*[1]"
  - T: "elevado a"      # phrase(x 'elevado a' y al cuadrado)
  - x: "*[2]"

- # [xxx] var^n
  name: nested-var-squared-or-cubed
  tag: power
  match:
  - "$ClearSpeak_Exponents = 'Auto' and"
  - "  *[2][self::m:mrow][count(*)=3][ "
  - "       *[3][self::m:power]["
  - "            *[2][self::m:mn][.='2' or .='3'] and " # exp is 2 or 3
  - "            *[1][self::m:mi]"
  - "           ] and "
  - "       *[2][self::m:mo][.='⁢'] and " # invisible times
  # base is mn, or common fraction ([xxx] case)
  - "       *[1][self::m:mn or "
  - "            self::m:fraction[*[1][self::m:mn][not(contains(., '.')) and text()<20]   and"
  - "                          *[2][self::m:mn][not(contains(., '.')) and 2<= text() and text()<=10]]"
  - "           ]"
  - "      ]"
  replace:
  - x: "*[1]"
  - T: "elevado a"      # phrase(x 'elevado a' y al cuadrado)
  - x: "*[2]"

- # -[xxx] var^n
  name: nested-negative-var-squared-or-cubed
  tag: power
  match:
  - "$ClearSpeak_Exponents = 'Auto' and"
  - "  *[2][self::m:mrow][count(*)=3][ "
  - "       *[3][self::m:power]["
  - "            *[2][self::m:mn][.='2' or .='3'] and " # exp is 2 or 3
  - "            *[1][self::m:mi]"
  - "           ] and "
  - "       *[2][self::m:mo][.='⁢'] and " # invisible times
  - "       *[1][self::m:minus and count(*)=1 and "
  # base is mn, or common fraction ([xxx] case)
  - "            *[1][self::m:mn or "
  - "                 self::m:fraction[*[1][self::m:mn][not(contains(., '.')) and text()<20]   and"
  - "                                  *[2][self::m:mn][not(contains(., '.')) and 2<= text() and text()<=10]]"
  - "                ]"
  - "           ]"
  - "      ]"
  replace:
  - x: "*[1]"
  - T: "elevado a"      # phrase(x 'elevado a' y al cuadrado)
  - x: "*[2]"

- name: default-exponent-power
  tag: power
  match: # directly a superscript or an mrow that contains a superscript
  - "*[2][self::m:power or self::m:power or self::m:mrow[m:power]]"
  replace:
  - x: "*[1]"
  - T: "elevado al exponente"      # phrase(x 'elevado al exponente' y al cuadrado)
  - pause: short
  - x: "*[2]"
  - pause: short
  - T: "fin de exponente"      # phrase(x elevado al exponente y al cuadrado 'fin de exponente')

- name: default
  # en inglés "power" cierra el exponente; en español se cierra con "fin de exponente"
  tag: power
  match: "."
  replace:
  - x: "*[1]"
  - T: "elevado a"      # phrase(x 'elevado a' n más 1)
  - x: "*[2]"
  - T: "fin de exponente"      # phrase(x elevado a n más 1 'fin de exponente')

#
# Some rules on mrows
#
- # the inference rules lump absolute value and cardinality together, so those rules are implemented here
  name: ClearSpeak-absolute-value
  tag: absolute-value
  match: "."
  variables: [WordToSay: "IfThenElse($ClearSpeak_AbsoluteValue = 'Cardinality', 'cardinal', 'valor absoluto')"]
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then: [OT: "el"]      # phrase('el' valor absoluto de 25)
  - x: "$WordToSay"
  - T: "de"      # phrase(el valor absoluto 'de' 25)
  - x: "*[1]"
  - test:
      if: "$ClearSpeak_AbsoluteValue = 'AbsEnd'"
      then:
      - pause: short
      - T: "fin del"      # phrase('fin del' valor absoluto)
      - x: "$WordToSay"
  - pause: short

- name: set
  tag: set
  # Empty set and braced/{set-builder} forms (typically 0–1 child).
  # Multi-arg intent set($x,$y,...) and set($x) with @arg fall through to function-intent
  # ("the set of …").
  match: "count(*)=0 or (count(*)=1 and not(*[1][@arg]))"
  replace:
  - test:
    - if: "count(*)=0"
      then: [T: "el conjunto vacío"]      # phrase('el conjunto vacío')
    - else_if: "count(*[1]/*)=3 and *[1]/*[2][self::m:mo][.=':' or .='|' or .='∣']"
      then:
      - test:
          if: "$Verbosity!='Terse'"
          then: [T: "el"]      # phrase('el' conjunto de todos los enteros)
      - T: "conjunto de"      # phrase(el 'conjunto de' números)
      - test:
          if: "$ClearSpeak_Sets != 'woAll'"
          then: [T: "todos los"]      # phrase(el conjunto de 'todos los' enteros)
      - x: "*[1]/*[1]"
      - T: "tal que"      # phrase(el conjunto S 'tal que' x es menor que y)
      - x: "*[1]/*[3]"
      else:
      - test:
          if: "$ClearSpeak_Sets != 'SilentBracket'"
          then:
          - test:
              if: "$Verbosity!='Terse'"
              then: [T: "el"]      # phrase('el' conjunto de enteros)
          - T: "conjunto"      # phrase(un 'conjunto' de enteros)
      - x: "*[1]"

- # intervals are controlled by a ClearSpeak Preference -- parens/brackets don't have to match, so we avoid IsBracketed
  # alternatively, we could have four (or ten) rules, but there is a lot of duplication if we do that
  # this one rule handles all ten cases listed as part $ClearSpeak_Paren = 'Interval'
  # note that *[2] is an mrow with X, ",", Y, so getting X or Y is a double index
  # en español: "el intervalo de 0 a 1, sin incluir 0 pero incluyendo 1"
  name: ClearSpeak-intervals # avoid overriding with default "intervals" name
  variables:
  - is_intervals_start_infinity: "*[1][self::m:minus and count(*)=1 and *[1][.='∞']]"
  - is_intervals_end_infinity: "*[2][.='∞'or (self::m:plus and count(*)=1 and *[1][.='∞'])]"
  tag: [open-interval, open-closed-interval, closed-interval, closed-open-interval]
  match: "."
  replace:
  - T: "el intervalo de"      # phrase('el intervalo de' a a b)
  - x: "*[1]"
  - T: "a"      # phrase(el intervalo de 0 'a' 1)
  - x: "*[2]"
  - pause: short
  - test:
      if: "not($is_intervals_start_infinity)"
      then:
      - test:
          if: "starts-with(name(.), 'open')"
          then: [T: "sin incluir"]      # phrase(el intervalo de a a b, 'sin incluir' a)
          else: [T: "incluyendo"]      # phrase(el intervalo de a a b, 'incluyendo' a)
      - x: "*[1]"
    # logic to deal with [not] arg #1
  - test:
      if: "not($is_intervals_start_infinity or $is_intervals_end_infinity)"
      then_test:
      - if: "name(.)='open-interval'"
        then: [T: "ni"]      # phrase(sin incluir a 'ni' b)
      - else_if: "name(.)='closed-interval'"
        then: [T: "y"]      # phrase(incluyendo a 'y' b)
        else: [T: "pero"]      # phrase(incluyendo a 'pero' sin incluir b)
    # some ugly logic dealing with connectives: or, but, but, and (cleaner to be part of next clause?)
  - test:
      if: "not($is_intervals_end_infinity)"
      then:
      - test:
          # there is some asymmetry to the test because of the and/or/but logic above
          if: "not( name(.)='open-interval' or name(.)='closed-interval' ) or $is_intervals_start_infinity"
          then:
          - test:
              if: "name(.) = 'open-interval' or name(.) = 'closed-open-interval'"
              then: [T: "sin incluir"]      # phrase(el intervalo 'sin incluir' b)
              else: [T: "incluyendo"]      # phrase(el intervalo 'incluyendo' b)
      - x: "*[2]"

    # onto the [not] [including]... part

- name: binomial-frac-vector
  tag: matrix
  match:
  - "$ClearSpeak_Matrix = 'Combinatorics' and "
  - "count(*[1]/*)=1 and count(*)=2"
  replace:
  - x: "*[1]/*[1]/*" # mtable/mtr/mtd
  - T: "sobre"      # phrase(the binomial coefficient n 'choose' m)
  - x: "*[2]/*[1]/*"

- name: ClearSpeak-default
  tag: [mtr, mlabeledtr]
  match: "parent::m:matrix or parent::m:determinant"
  variables: [NextLineIsContinuedRow: "following-sibling::*[1][contains(@data-intent-property, ':continued-row:')]"]
  replace:
  - pause: medium
  - T: "fila"      # phrase(the first 'row' of a matrix)
  - x: "count(preceding-sibling::*)+1"
  - test:
      if: ".[self::m:mlabeledtr]"
      then:
      - T: "con etiqueta"      # phrase(the line 'with label' first equation)
      - x: "*[1]/*"
      - pause: short
  - pause: medium
  - test:
      if: ".[self::m:mlabeledtr]"
      then: [x: "*[position()>1]"]
      else: [x: "*"]

- # handle both log and ln
  name: ClearSpeak-log
  tag: mi
  match: ".='log' or .='ln'"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity!='Terse' and not(IsNode(following-sibling::*[2],'simple'))"
      then: [OT: "el"]      # phrase('el' logaritmo de x más 1)
  - test:
    - if: ".='log' and $Verbosity='Terse'"
      then: [T: "log"]
    - else_if: ".='log'"
      then: [T: "logaritmo"]      # phrase(el 'logaritmo' de x)
    - else_if: "$Verbosity='Terse' and $ClearSpeak_Log != 'LnAsNaturalLog'"
      then: [spell: "'ln'"]
      else: [T: "logaritmo natural"]      # phrase(el 'logaritmo natural' de x), como el CMU

- name: ClearSpeak-multi-line
  tag: [piecewise, system-of-equations, lines] # these are ignored in favor of the ClearSpeak prefs
  match: "."
  variables:
    # Wikipedia has some tables where all the entire first column is empty (e.g., https://en.wikipedia.org/wiki/List_of_trigonometric_identities)
  - LineCount: "count(*[not(contains(@data-intent-property, ':continued-row:'))])"
  - NextLineIsContinuedRow: "false()"   # default value
  - IsColumnSilent: true()
  replace:
  - test:
    - if: "$ClearSpeak_MultiLineOverview = 'Auto'"
      then:
      - x: "$LineCount"
      - test:
        - if: "($ClearSpeak_MultiLineLabel = 'Auto' and self::m:piecewise) or $ClearSpeak_MultiLineLabel = 'Case'"
          then_test:
            if: "$LineCount = 1"
            then: [T: "caso"]      # phrase(1 'caso')
            else: [T: "casos"]      # phrase(3 'casos')
        - else_if: "$ClearSpeak_MultiLineLabel = 'Auto' or $ClearSpeak_MultiLineLabel = 'Line' or $ClearSpeak_MultiLineLabel = 'None'"
          then_test:
            if: "$LineCount = 1"
            then: [T: "línea"]      # phrase(1 'línea')
            else: [T: "líneas"]      # phrase(3 'líneas')
        - else_if: "$ClearSpeak_MultiLineLabel = 'Constraint'"
          then_test:
            if: "$LineCount = 1"
            then: [T: "restricción"]      # phrase(1 'restricción')
            else: [T: "restricciones"]      # phrase(3 'restricciones')
        - else_if: "$ClearSpeak_MultiLineLabel = 'Equation'"
          then_test:
            if: "$LineCount = 1"
            then: [T: "ecuación"]      # phrase(1 'ecuación')
            else: [T: "ecuaciones"]      # phrase(3 'ecuaciones')
        - else_if: "$ClearSpeak_MultiLineLabel = 'Row'"
          then_test:
            if: "$LineCount = 1"
            then: [T: "fila"]      # phrase(1 'fila')
            else: [T: "filas"]      # phrase(3 'filas')
        - else_if: "$ClearSpeak_MultiLineLabel = 'Step'"
          then_test:
            if: "$LineCount = 1"
            then: [T: "paso"]      # phrase(1 'paso')
            else: [T: "pasos"]      # phrase(3 'pasos')
          # else 'None -- don't say anything'
      - pause: short
  - x: "*"
  - pause: long

- name: ClearSpeak-default-multiline
  tag: [mtr, mlabeledtr]
  match: "parent::m:piecewise or parent::m:system-of-equations or parent::m:lines"
  variables: [NextLineIsContinuedRow: "following-sibling::*[1][contains(@data-intent-property, ':continued-row:')]"]
  replace:
  - test:
      if: "not($LineCount=1 or $ClearSpeak_MultiLineLabel='None' or contains(@data-intent-property, ':continued-row:'))"
      then:
      - pause: medium
      - test:
        - if: "($ClearSpeak_MultiLineLabel = 'Auto' and self::m:piecewise) or $ClearSpeak_MultiLineLabel = 'Case'"
          then: [T: "caso"]      # phrase('caso' 1)
        - else_if: "$ClearSpeak_MultiLineLabel = 'Auto' or $ClearSpeak_MultiLineLabel = 'Line'"
          then: [T: "línea"]      # phrase('línea' 1)
        - else_if: "$ClearSpeak_MultiLineLabel = 'Constraint'"
          then: [T: "restricción"]      # phrase('restricción' 1)
        - else_if: "$ClearSpeak_MultiLineLabel = 'Equation'"
          then: [T: "ecuación"]      # phrase('ecuación' 1)
        - else_if: "$ClearSpeak_MultiLineLabel = 'Row'"
          then: [T: "fila"]      # phrase('fila' 1)
        - else_if: "$ClearSpeak_MultiLineLabel = 'Step'"
          then: [T: "paso"]      # phrase('paso' 1)
          # else 'None -- don't say anything'
      - x: "count(preceding-sibling::*[not(contains(@data-intent-property, ':continued-row:'))]) + 1"
  - test:
      if: "self::m:mlabeledtr"
      then:
      - T: "con etiqueta"      # phrase(fila 1 'con etiqueta' (3.1))
      - x: "*[1]/*"
  - test:
    - if: "$ClearSpeak_MultiLineLabel='None'"
      then: [pause: xlong]   # need a very long pause with no line labels
    - else_if: "not(contains(@data-intent-property, ':continued-row:'))"
      then: [pause: medium]
  - test:
      if: "self::m:mlabeledtr"
      then: [x: "*[position()>1]"]
      else: [x: "*"]

- name: ClearSpeak_Functions_None
  tag: mo
  match:
  - ".='⁡' and $ClearSpeak_Functions = 'None' and"
  - "not(preceding-sibling::*[1][IsInDefinition(., 'TrigFunctionNames')])" # Functions=None does not apply to "trig" functions
  replace:
    test:
      if: "$ClearSpeak_ImpliedTimes = 'None'"
      then: [T: ""]
      else_test:
        if: "$Verbosity = 'Verbose'"
        then: [T: "multiplicado por"]      # phrase(7 'multiplicado por' 5 es 35)
        else: [T: "por"]      # phrase(7 'por' 5 es 35)

- name: no-times
  tag: mo
  match:
  # Note: this rule is also part of the paren rule so that the parens speak
  - ".='⁢' and $ClearSpeak_ImpliedTimes = 'None'"
  replace:
  - T: ""

- name: ClearSpeak-times
  tag: mo
  match:
  # say "times" when invisible times is followed by parens or a superscript that has a base with parens or "|"s
  # if we aren't sure if it is times or not, don't say anything
  - ".='⁢' and (not(@data-function-guess) or $ClearSpeak_Functions = 'None') and"
  - "not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')]) and ("
  - "  $ClearSpeak_ImpliedTimes = 'MoreImpliedTimes'"
  - " or "
  - "  following-sibling::*[1]["
  - "    IsBracketed(., '(', ')') or IsBracketed(., '[', ']') or IsBracketed(., '|', '|') or "
  # most of these aren't mentioned in ClearSpeak spec, but are (I think) expected uses of "times"
  - "    self::m:matrix or self::m:determinant or self::m:binomial or" # followed by parens
  - "    self::m:square-root or self::m:msqrt or self::m:root or self::m:mroot or"
  - "    (self::m:msub or self::m:msubsup or"
  - "    ((self::m:msup or self::m:power) and not(IsNode(*[1], 'leaf') and *[2][self::m:mn and (.=2 or '.=3')]))) and " # followed by msup, etc.
  - "     (*[1][self::m:mrow[IsBracketed(., '(', ')') or IsBracketed(., '[', ']') or IsBracketed(., '|', '|')] or "
  - "           self::m:matrix or self::m:determinant] or" # base has parens
  - "      not(IsNode(*[2], 'simple')) or "
  - "      (self::m:msubsup and not(IsNode(*[3], 'simple')))"
  - "     )"
  - "  ]"
  # other possibility is the preceding element has parens (but not the following)
  # this is not mentioned in the ClearSpeak rules or examples but seems like it should say "times". E.g, |x| y
  - " or "
  - "  preceding-sibling::*[1]["
  - "    IsBracketed(., '(', ')') or IsBracketed(., '[', ']') or IsBracketed(., '|', '|')]" # followed by parens
  - " )"
  replace:
  - test:
      if: "$Verbosity = 'Verbose'"
      then: [T: "multiplicado por"]      # phrase(7 'multiplicado por' 5 es 35)
      else: [T: "por"]      # phrase(7 'por' 5 es 35)

- name: numero-con-signo-entre-parentesis
  # (−2) + (+1): "2 negativo más 1 positivo", como se enseña en el colegio (solo con verbosidad Verbose). Solo números
  # entre paréntesis; sin paréntesis el signo sigue siendo "menos"/"más" (−2 + 1: "menos 2 más 1").
  tag: mrow
  match:
  - "$Verbosity='Verbose' and"
  - "count(*)=3 and *[1][.='('] and *[3][.=')'] and"
  - "*[2][(self::m:minus or self::m:plus) and count(*)=1 and contains(@data-intent-property, ':prefix:')][*[1][self::m:mn]] and"
  - "not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')])"
  replace:
  - x: "*[2]"      # el signo lo dice la regla signo-de-numero-entre-parentesis

- name: no-say-parens
  tag: mrow
  match:
  - "parent::*[not(self::m:msup) and not(self::m:msub) and not(self::m:msubsup) and not(self::m:power) and"
  - "          not(self::m:math) ] and "       # rule out [x] standing alone
  - "( IsBracketed(., '(', ')') or IsBracketed(., '[', ']') ) and "
  - "not( $ClearSpeak_Functions = 'None' and "
  - "     (preceding-sibling::*[1][.='⁡'] or following-sibling::*[1][.='⁡']) ) and "
  - "not( $ClearSpeak_ImpliedTimes = 'None' and "
  - "     (preceding-sibling::*[1][.='⁢'] or following-sibling::*[1][.='⁢']) ) and "
  - "IsNode(*[2], 'simple') and"
  - "not(preceding-sibling::*[1][.='\u2062' and @data-function-guess]) and"
  - "not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')])"
  # missing clause: 'a positive fraction that is spoken as an ordinal
  #   (either by the Ordinal preference or by the default rules)'
  replace:
  - x: "*[2]"

- include: "SharedRules/geometry.yaml"

- include: "SharedRules/linear-algebra.yaml"

- include: "SharedRules/general.yaml"

- include: "SharedRules/default.yaml"
