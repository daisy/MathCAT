  # La palabra que une una función con su argumento en las IntentMappings funcionales (en inglés, "of").
  # Probablemente es la misma que se usa para U+2061 en unicode.yaml, pero por razones técnicas se define aquí.
  # Es un vector de largo 1 porque no se admiten escalares.
- FunctionApplicationWord: ["de"]

