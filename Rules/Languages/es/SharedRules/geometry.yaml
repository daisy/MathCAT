
---

- name: line-segment
  tag: line-segment
  match: "count(*)=2"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: "el"]      # phrase('el' segmento A B), CMU
  - T: "segmento"      # phrase(el 'segmento' A B)
  - x: "*[1]"
  - x: "*[2]"

- name: geometry-ray
  tag: ray
  match: "count(*)=2"
  replace:
  - test:
      if: "$Verbosity='Verbose'"
      then:
      - T: "la semirrecta de"
      - x: "*[1]"
      - T: "a"
      - x: "*[2]"
      else:
      - T: "semirrecta"
      - x: "*[1]"
      - x: "*[2]"

- name: geometry-arc
  tag: arc
  match: "count(*)=2"
  replace:
  - test:
      if: "$Verbosity='Verbose'"
      then: [T: "el"]
  - T: "arco"
  - x: "*[1]"
  - x: "*[2]"

- name: measure-of-angle
  tag: measure-of-angle
  match: "count(*)=3"
  replace:
  - test:
      if: "$Verbosity='Verbose'"
      then:
      - T: "la medida del ángulo"
      else:
      - T: "medida del ángulo"
  - x: "*[1]"
  - x: "*[2]"
  - x: "*[3]"


- name: coordinate
  tag: coordinate
  # Intent forms coordinate($x,...) use @arg and fall through to function-intent / IntentMappings
  match: "not(*[@arg])"
  replace:
  - test:
      if: "$Verbosity='Verbose'"
      then: [OT: "el"]      # phrase('el' punto de coordenadas 1, 2)
  - T: "punto"      # phrase(el 'punto' de coordenadas 1, 2)
  - test:
      if: "$Verbosity='Verbose'"
      then: [T: "de coordenadas"]      # phrase(el punto 'de coordenadas' 1, 2)
  - pause: short
  - insert:
      nodes: "*"
      replace: [T: "coma", pause: auto]      # phrase(f de x 'coma' y)
  - pause: short
  - test:
      if: "($SpeechStyle='ClearSpeak' and $Verbosity='Verbose') or not(IsNode(*[last()],'leaf'))"
      then: [T: "fin del punto"]      # phrase(inicio del punto, 'fin del punto')
