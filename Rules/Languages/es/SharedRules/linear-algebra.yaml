---

- name: scalar-determinant
  tag: determinant
  match: "count(*)=1 and not(*[1][self::m:mtr])"
  replace:
  - test:
      if: "$Verbosity='Verbose'"
      then:
      - T: "el"
  - T: "determinante"
  - test:
      if: "$Verbosity!='Terse'"
      then:
      - T: "de"
  - x: "*[1]"
  - test:
      if: "not(IsNode(*[1], 'simple')) and $Impairment = 'Blindness'"
      then: [T: "fin del determinante"]


- name: subscripted-norm
  tag: subscripted-norm
  match: "count(*)=2"
  replace:
  - test:
      if: "$Verbosity='Verbose'"
      then:
      - T: "la"
  - T: "norma"      # phrase(la 'norma' p de f)
  - x: "*[2]"
  - test:
      if: "$Verbosity!='Terse'"
      then:
      - T: "de"
  - x: "*[1]"

# propia del español: ‖f‖_p en LaTeX corriente llega como msub de magnitude; se lee "la norma p de f"
- name: subscripted-magnitude
  tag: [msub, indexed-by]
  match: "*[1][self::m:magnitude and count(*)=1]"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: "la"]      # phrase('la' norma p de f)
  - T: "norma"      # phrase(la 'norma' p de f)
  - x: "*[2]"
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: "de"]      # phrase(la norma p 'de' f)
  - x: "*[1]/*[1]"
