---
# Ordinales escritos en una fórmula: 1.º, 2.ª, 3.er, 1\text{.\textsuperscript{o}}, 1.^{\text{o}}, 1^{\text{o}}
# → "primero", "segunda", "tercer". Del 1 al 99. La letra marca el género y el número:
# o (primero), a (primera), er (primer, tercer), os (primeros), as (primeras).
# Se incluye al principio de ClearSpeak y SimpleSpeak para ganarle a las reglas de potencias.

# el número lee el ordinal
- name: ordinal
  tag: mn
  match:
  - "translate(., '0123456789', '') = '' and string-length(.) >= 1 and string-length(.) <= 2 and number(.) >= 1 and ("
  - "  following-sibling::*[not(self::m:mo and .='\u2062')][1][self::m:mtext or self::m:mi][contains('|.o|.a|.er|.os|.as|.º|.ª|º|ª|', concat('|', substring-before(concat(normalize-space(.), ' '), ' '), '|'))] or"
  - "  following-sibling::*[not(self::m:mo and .='\u2062')][1][self::m:msup or self::m:power][*[1][self::m:mo][.='.'] and *[2][self::m:mtext or self::m:mi][contains('|o|a|er|os|as|º|ª|𝑜|𝑎|', concat('|', ., '|'))]] or"
  - "  following-sibling::*[not(self::m:mo and .='\u2062')][1][self::m:mo][.='.']/following-sibling::*[not(self::m:mo and .='\u2062')][1][self::m:mtext or self::m:mi][.='º' or .='ª'] or"
  - "  parent::*[self::m:msup or self::m:power][*[2][self::m:mtext][contains('|o|a|er|os|as|', concat('|', ., '|'))]] and not(preceding-sibling::*)"
  - ")"
  variables:
  - OrdN: "number(.)"
  - OrdM: "translate(substring-before(concat(normalize-space(string(following-sibling::*[not(self::m:mo and .='\u2062')][1][self::m:mtext or self::m:mi] | following-sibling::*[not(self::m:mo and .='\u2062')][1][self::m:msup or self::m:power]/*[2] | following-sibling::*[not(self::m:mo and .='\u2062')][1][self::m:mo][.='.']/following-sibling::*[not(self::m:mo and .='\u2062')][1] | parent::*[self::m:msup or self::m:power]/*[2])), ' '), ' '), '.', '')"
  replace:
  - bookmark: "@id"
  - with:
      variables: [OrdFem: "$OrdM = 'a' or $OrdM = 'ª' or $OrdM = 'as' or $OrdM = '𝑎'"]
      replace:
      - test:
          if: "$OrdN >= 20"
          then: [x: "concat(IfThenElse($OrdFem, concat(substring(DefinitionValue(string(floor($OrdN div 10)), 'Speech', 'OrdinalesDecenas'), 1, string-length(DefinitionValue(string(floor($OrdN div 10)), 'Speech', 'OrdinalesDecenas')) - 1), 'a'), DefinitionValue(string(floor($OrdN div 10)), 'Speech', 'OrdinalesDecenas')), IfThenElse($OrdM = 'os' or $OrdM = 'as', 's', ''))"]      # phrase('vigésimo' primero)
      - test:
          if: "$OrdN < 20 or $OrdN mod 10 != 0"
          then: [x: "concat(IfThenElse($OrdFem, concat(substring(DefinitionValue(string(IfThenElse($OrdN < 20, $OrdN, $OrdN mod 10)), 'Speech', 'OrdinalesUnidades'), 1, string-length(DefinitionValue(string(IfThenElse($OrdN < 20, $OrdN, $OrdN mod 10)), 'Speech', 'OrdinalesUnidades')) - 1), 'a'), IfThenElse($OrdM = 'er' and (substring(DefinitionValue(string(IfThenElse($OrdN < 20, $OrdN, $OrdN mod 10)), 'Speech', 'OrdinalesUnidades'), string-length(DefinitionValue(string(IfThenElse($OrdN < 20, $OrdN, $OrdN mod 10)), 'Speech', 'OrdinalesUnidades')) - 6) = 'primero' or substring(DefinitionValue(string(IfThenElse($OrdN < 20, $OrdN, $OrdN mod 10)), 'Speech', 'OrdinalesUnidades'), string-length(DefinitionValue(string(IfThenElse($OrdN < 20, $OrdN, $OrdN mod 10)), 'Speech', 'OrdinalesUnidades')) - 6) = 'tercero'), substring(DefinitionValue(string(IfThenElse($OrdN < 20, $OrdN, $OrdN mod 10)), 'Speech', 'OrdinalesUnidades'), 1, string-length(DefinitionValue(string(IfThenElse($OrdN < 20, $OrdN, $OrdN mod 10)), 'Speech', 'OrdinalesUnidades')) - 1), DefinitionValue(string(IfThenElse($OrdN < 20, $OrdN, $OrdN mod 10)), 'Speech', 'OrdinalesUnidades'))), IfThenElse($OrdM = 'os' or $OrdM = 'as', 's', ''))"]      # phrase(el 'primer' término)

# todo como texto: \text{1.\textsuperscript{o}} llega como "1.o"
- name: ordinal-text
  tag: mtext
  match: "translate(substring-before(., '.'), '0123456789', '') = '' and string-length(substring-before(., '.')) >= 1 and string-length(substring-before(., '.')) <= 2 and number(substring-before(., '.')) >= 1 and contains('|o|a|er|os|as|º|ª|', concat('|', substring-after(., '.'), '|'))"
  variables:
  - OrdN: "number(substring-before(., '.'))"
  - OrdM: "substring-after(., '.')"
  replace:
  - bookmark: "@id"
  - with:
      variables: [OrdFem: "$OrdM = 'a' or $OrdM = 'ª' or $OrdM = 'as' or $OrdM = '𝑎'"]
      replace:
      - test:
          if: "$OrdN >= 20"
          then: [x: "concat(IfThenElse($OrdFem, concat(substring(DefinitionValue(string(floor($OrdN div 10)), 'Speech', 'OrdinalesDecenas'), 1, string-length(DefinitionValue(string(floor($OrdN div 10)), 'Speech', 'OrdinalesDecenas')) - 1), 'a'), DefinitionValue(string(floor($OrdN div 10)), 'Speech', 'OrdinalesDecenas')), IfThenElse($OrdM = 'os' or $OrdM = 'as', 's', ''))"]      # phrase('vigésimo' primero)
      - test:
          if: "$OrdN < 20 or $OrdN mod 10 != 0"
          then: [x: "concat(IfThenElse($OrdFem, concat(substring(DefinitionValue(string(IfThenElse($OrdN < 20, $OrdN, $OrdN mod 10)), 'Speech', 'OrdinalesUnidades'), 1, string-length(DefinitionValue(string(IfThenElse($OrdN < 20, $OrdN, $OrdN mod 10)), 'Speech', 'OrdinalesUnidades')) - 1), 'a'), IfThenElse($OrdM = 'er' and (substring(DefinitionValue(string(IfThenElse($OrdN < 20, $OrdN, $OrdN mod 10)), 'Speech', 'OrdinalesUnidades'), string-length(DefinitionValue(string(IfThenElse($OrdN < 20, $OrdN, $OrdN mod 10)), 'Speech', 'OrdinalesUnidades')) - 6) = 'primero' or substring(DefinitionValue(string(IfThenElse($OrdN < 20, $OrdN, $OrdN mod 10)), 'Speech', 'OrdinalesUnidades'), string-length(DefinitionValue(string(IfThenElse($OrdN < 20, $OrdN, $OrdN mod 10)), 'Speech', 'OrdinalesUnidades')) - 6) = 'tercero'), substring(DefinitionValue(string(IfThenElse($OrdN < 20, $OrdN, $OrdN mod 10)), 'Speech', 'OrdinalesUnidades'), 1, string-length(DefinitionValue(string(IfThenElse($OrdN < 20, $OrdN, $OrdN mod 10)), 'Speech', 'OrdinalesUnidades')) - 1), DefinitionValue(string(IfThenElse($OrdN < 20, $OrdN, $OrdN mod 10)), 'Speech', 'OrdinalesUnidades'))), IfThenElse($OrdM = 'os' or $OrdM = 'as', 's', ''))"]      # phrase(el 'primer' término)

# la marca no se lee (ya la leyó la regla "ordinal"); si es un texto que sigue ("1.er término"), se lee el resto
- name: ordinal-mark-text
  tag: [mtext, mi]
  match: "contains('|.o|.a|.er|.os|.as|.º|.ª|º|ª|', concat('|', substring-before(concat(normalize-space(.), ' '), ' '), '|')) and preceding-sibling::*[not(self::m:mo and .='\u2062')][1][self::m:mn][translate(., '0123456789', '') = '' and string-length(.) >= 1 and string-length(.) <= 2 and number(.) >= 1]"
  replace:
  - test:
      if: "contains(normalize-space(.), ' ')"
      then: [x: "substring-after(normalize-space(.), ' ')"]

- name: ordinal-mark
  tag: [mtext, mi, mo, msup, power]
  match:
  - "(self::m:msup or self::m:power) and *[1][self::m:mo][.='.'] and *[2][self::m:mtext or self::m:mi][contains('|o|a|er|os|as|º|ª|𝑜|𝑎|', concat('|', ., '|'))] and preceding-sibling::*[not(self::m:mo and .='\u2062')][1][self::m:mn][translate(., '0123456789', '') = '' and string-length(.) >= 1 and string-length(.) <= 2 and number(.) >= 1] or"
  - "self::m:mo and .='.' and following-sibling::*[not(self::m:mo and .='\u2062')][1][self::m:mtext or self::m:mi][.='º' or .='ª'] and preceding-sibling::*[not(self::m:mo and .='\u2062')][1][self::m:mn][translate(., '0123456789', '') = '' and string-length(.) >= 1 and string-length(.) <= 2 and number(.) >= 1] or"
  - "(self::m:mtext or self::m:mi) and (.='º' or .='ª') and preceding-sibling::*[not(self::m:mo and .='\u2062')][1][self::m:mo][.='.']/preceding-sibling::*[not(self::m:mo and .='\u2062')][1][self::m:mn][translate(., '0123456789', '') = '' and string-length(.) >= 1 and string-length(.) <= 2 and number(.) >= 1]"
  replace: []

# 1^{\text{o}}: el número lee el ordinal y el exponente no se lee
- name: ordinal-power
  tag: [msup, power]
  match: "*[1][self::m:mn][translate(., '0123456789', '') = '' and string-length(.) >= 1 and string-length(.) <= 2 and number(.) >= 1] and *[2][self::m:mtext][contains('|o|a|er|os|as|', concat('|', ., '|'))]"
  replace:
  - x: "*[1]"
