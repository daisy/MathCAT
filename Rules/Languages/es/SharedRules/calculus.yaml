---

- name: laplacian
  tag: laplacian
  match: "count(*) <= 1"   # can be on ∇^2 or on enclosing mrow
  replace:
  - T: "laplaciano"      # phrase(el 'laplaciano' de x)
  - test:
      if: "count(*) = 1"
      then:
      - test:
          if: "$Verbosity!='Terse'"
          then: [T: "de"]             # phrase(función 'de' una variable)
      - test:
          if: "not(IsNode(*[1], 'leaf'))"
          then: [pause: short]
      - x: "*[1]"

- name: divergence
  tag: divergence
  match: "count(*) = 1"
  replace:
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "div"]             # phrase('div' es la abreviatura de divergencia)
      else: [T: "divergencia de"]      # phrase(la 'divergencia de' un campo)
  - test:
      if: "not(IsNode(*[1], 'leaf'))"
      then: [pause: short]
  - x: "*[1]"

- name: curl
  tag: curl
  match: "count(*) = 1"
  replace:
  - T: "rotacional"      # phrase(el 'rotacional' de un campo)
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: "de"]             # phrase(función 'de' una variable)
  - test:
      if: "not(IsNode(*[1], 'leaf'))"
      then: [pause: short]
  - x: "*[1]"

- name: gradient
  tag: gradient
  match: "count(*) = 1"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: "gradiente de"]      # phrase(el 'gradiente de' una función)
      else: [T: "nabla"]      # phrase(el operador 'nabla')
  - test:
      if: "not(IsNode(*[1], 'leaf'))"
      then: [pause: short]
  - x: "*[1]"
