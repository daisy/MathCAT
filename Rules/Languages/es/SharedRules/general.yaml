# funciones trigonométricas inversas: "arco seno de x" (CMU) en vez de deletrear "arcsin"
# PARCHE TEMPORAL (sacar cuando se arregle merge_arc_trig en src/canonicalize.rs):
# babel en español escribe \arcsen como "arc\,sen" y MathCAT no une "arc" con el nombre
# de la función cuando hay un espacio entre medio, así que llega como arc ⁡ sen y se lee
# "arc de seno". Estas tres reglas lo leen como "arco seno de x".
# Parent arc-trig-* rules already speak "de"/the name; keep ⁡/⁢ silent when visited for nav.
- name: arc-trig-invisible-nav-only
  tag: mo
  match:
  - "(.='⁡' or .='⁢') and parent::*["
  - "  (count(*)=3 and *[1][self::m:mi][.='arc']) or"
  - "  (count(*)=5 and *[1][self::m:mi][.='arc']) or"
  - "  (count(*)=3 and *[1][self::m:mrow][*[1][.='arc']])"
  - "]"
  replace:
  - T: ""

- name: arc-trig-separado-aplicado
  tag: mrow
  match: "count(*)=3 and *[1][self::m:mrow][count(*)=3 and *[1][self::m:mi][.='arc'] and *[2][self::m:mo][.='⁡'] and *[3][self::m:mi][.='sen' or .='sin' or .='cos' or .='tan' or .='tg' or .='sec' or .='csc' or .='cosec' or .='cot' or .='cotg' or .='ctg' or .='cotan']] and *[2][self::m:mo][.='⁢' or .='⁡'] and not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')])"
  replace:
  - x: "*[1]"
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: "de"]      # phrase(arco seno 'de' x)
  - pause: auto
  - x: "*[2]"   # mark times/apply for MoveNext (speech suppressed by arc-trig-invisible-nav-only)
  - x: "*[3]"

- name: arc-trig-separado-plano
  tag: mrow
  match: "count(*)=5 and *[1][self::m:mi][.='arc'] and *[2][self::m:mo][.='⁡'] and *[3][self::m:mi][.='sen' or .='sin' or .='cos' or .='tan' or .='tg' or .='sec' or .='csc' or .='cosec' or .='cot' or .='cotg' or .='ctg' or .='cotan'] and *[4][self::m:mo][.='⁡'] and not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')])"
  replace:
  - bookmark: "*[1]/@id"
  - test:
    - if: "*[3][.='sen' or .='sin']"
      then: [T: "arco seno"]
    - else_if: "*[3][.='cos']"
      then: [T: "arco coseno"]
    - else_if: "*[3][.='tan' or .='tg']"
      then: [T: "arco tangente"]
    - else_if: "*[3][.='sec']"
      then: [T: "arco secante"]
    - else_if: "*[3][.='csc' or .='cosec']"
      then: [T: "arco cosecante"]
    - else: [T: "arco cotangente"]
  - x: "*[2]"   # mark function-apply for MoveNext (speech suppressed by arc-trig-invisible-nav-only)
  - x: "*[4]"   # mark function-apply for MoveNext (speech suppressed by arc-trig-invisible-nav-only)
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: "de"]      # phrase(arco seno 'de' x)
  - pause: auto
  - x: "*[5]"

- name: arc-trig-separado
  tag: mrow
  match: "count(*)=3 and *[1][self::m:mi][.='arc'] and *[2][self::m:mo][.='⁡'] and *[3][self::m:mi][.='sen' or .='sin' or .='cos' or .='tan' or .='tg' or .='sec' or .='csc' or .='cosec' or .='cot' or .='cotg' or .='ctg' or .='cotan'] and not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')])"
  replace:
  - bookmark: "*[1]/@id"
  - test:
    - if: "*[3][.='sen' or .='sin']"
      then: [T: "arco seno"]
    - else_if: "*[3][.='cos']"
      then: [T: "arco coseno"]
    - else_if: "*[3][.='tan' or .='tg']"
      then: [T: "arco tangente"]
    - else_if: "*[3][.='sec']"
      then: [T: "arco secante"]
    - else_if: "*[3][.='csc' or .='cosec']"
      then: [T: "arco cosecante"]
    - else: [T: "arco cotangente"]
  - x: "*[2]"   # mark function-apply for MoveNext (speech suppressed by arc-trig-invisible-nav-only)

