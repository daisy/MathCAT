# funciones trigonométricas inversas: "arco seno de x" (CMU) en vez de deletrear "arcsin"
# PARCHE TEMPORAL (sacar cuando se arregle merge_arc_trig en src/canonicalize.rs):
# babel en español escribe \arcsen como "arc\,sen" y MathCAT no une "arc" con el nombre
# de la función cuando hay un espacio entre medio, así que llega como arc ⁡ sen y se lee
# "arc de seno". Estas tres reglas lo leen como "arco seno de x".
- name: arc-trig-separado-aplicado
  tag: mrow
  match: "count(*)=3 and *[1][self::m:mrow][count(*)=3 and *[1][self::m:mi][.='arc'] and *[2][self::m:mo][.='⁡'] and *[3][self::m:mi][.='sen' or .='sin' or .='cos' or .='tan' or .='tg' or .='sec' or .='csc' or .='cosec' or .='cot' or .='cotg' or .='ctg' or .='cotan']] and *[2][self::m:mo][.='⁢' or .='⁡'] and not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')])"
  replace:
  - x: "*[1]"
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: "de"]      # phrase(arco seno 'de' x)
  - pause: auto
  - x: "*[3]"

- name: arc-trig-separado-plano
  tag: mrow
  match: "count(*)=5 and *[1][self::m:mi][.='arc'] and *[2][self::m:mo][.='⁡'] and *[3][self::m:mi][.='sen' or .='sin' or .='cos' or .='tan' or .='tg' or .='sec' or .='csc' or .='cosec' or .='cot' or .='cotg' or .='ctg' or .='cotan'] and *[4][self::m:mo][.='⁡'] and not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')])"
  replace:
  - bookmark: "*[1]/@id"
  - test:
    - if: "*[3][.='sen' or .='sin']"
      then: [T: "arco seno"]
    - else_if: "*[3][.='cos']"
      then: [T: "arco coseno"]
    - else_if: "*[3][.='tan' or .='tg']"
      then: [T: "arco tangente"]
    - else_if: "*[3][.='sec']"
      then: [T: "arco secante"]
    - else_if: "*[3][.='csc' or .='cosec']"
      then: [T: "arco cosecante"]
    - else: [T: "arco cotangente"]
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: "de"]      # phrase(arco seno 'de' x)
  - pause: auto
  - x: "*[5]"

- name: arc-trig-separado
  tag: mrow
  match: "count(*)=3 and *[1][self::m:mi][.='arc'] and *[2][self::m:mo][.='⁡'] and *[3][self::m:mi][.='sen' or .='sin' or .='cos' or .='tan' or .='tg' or .='sec' or .='csc' or .='cosec' or .='cot' or .='cotg' or .='ctg' or .='cotan'] and not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')])"
  replace:
  - bookmark: "*[1]/@id"
  - test:
    - if: "*[3][.='sen' or .='sin']"
      then: [T: "arco seno"]
    - else_if: "*[3][.='cos']"
      then: [T: "arco coseno"]
    - else_if: "*[3][.='tan' or .='tg']"
      then: [T: "arco tangente"]
    - else_if: "*[3][.='sec']"
      then: [T: "arco secante"]
    - else_if: "*[3][.='csc' or .='cosec']"
      then: [T: "arco cosecante"]
    - else: [T: "arco cotangente"]

- name: arcsin
  tag: mi
  match: ".='arcsin' or .='arcsen'"
  replace:
  - bookmark: "@id"
  - T: "arco seno"

- name: arccos
  tag: mi
  match: ".='arccos'"
  replace:
  - bookmark: "@id"
  - T: "arco coseno"

- name: arctan
  tag: mi
  match: ".='arctan' or .='arctang' or .='arctg'"
  replace:
  - bookmark: "@id"
  - T: "arco tangente"

- name: arcsec
  tag: mi
  match: ".='arcsec'"
  replace:
  - bookmark: "@id"
  - T: "arco secante"

- name: arccsc
  tag: mi
  match: ".='arccsc' or .='arccosec'"
  replace:
  - bookmark: "@id"
  - T: "arco cosecante"

- name: arccot
  tag: mi
  match: ".='arccot' or .='arccotan' or .='arccotg' or .='arcctg'"
  replace:
  - bookmark: "@id"
  - T: "arco cotangente"

- name: arcsinh
  tag: mi
  match: ".='arcsinh' or .='arcsenh' or .='arsinh' or .='argsinh' or .='argsenh'"
  replace:
  - bookmark: "@id"
  - T: "argumento seno hiperbólico"

- name: arccosh
  tag: mi
  match: ".='arccosh' or .='arcosh' or .='argcosh'"
  replace:
  - bookmark: "@id"
  - T: "argumento coseno hiperbólico"

- name: arctanh
  tag: mi
  match: ".='arctanh' or .='artanh' or .='argtanh' or .='argtgh' or .='arctgh'"
  replace:
  - bookmark: "@id"
  - T: "argumento tangente hiperbólica"

- name: arcsech
  tag: mi
  match: ".='arcsech' or .='arsech' or .='argsech'"
  replace:
  - bookmark: "@id"
  - T: "argumento secante hiperbólica"

- name: arccsch
  tag: mi
  match: ".='arccsch' or .='arccosech' or .='arcsch' or .='argcsch'"
  replace:
  - bookmark: "@id"
  - T: "argumento cosecante hiperbólica"

- name: arccoth
  tag: mi
  match: ".='arccoth' or .='arccotanh' or .='arcoth' or .='argcoth'"
  replace:
  - bookmark: "@id"
  - T: "argumento cotangente hiperbólica"

- name: exponential
  tag: mi
  match: ".='exp'"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "exp"]
      else: [T: "exponencial"]

- name: covariance
  tag: mi
  match: ".='Cov'"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "cov"]
      else: [T: "covarianza"]

- name: factorial-de
  # propia del español, como el CMU: "factorial de n", "doble factorial de n"
  tag: mrow
  match: "count(*)=2 and *[2][self::m:mo][.='!'] and not(*[1][self::m:mo]) and not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')])"
  replace:
  - T: "factorial de"      # phrase('factorial de' n)
  - x: "*[1]"

- name: doble-factorial-de
  tag: mrow
  match: "count(*)=2 and *[2][self::m:mo][.='‼'] and not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')])"
  replace:
  - T: "doble factorial de"      # phrase('doble factorial de' n)
  - x: "*[1]"

- name: max-min
  # propia del español: "máx" y "mín" se leen enteros ("el máximo de a coma b"); el sintetizador diría "max"
  tag: mi
  match:
  - "(.='max' or .='máx' or .='min' or .='mín' or .='mcd' or .='mcm' or .='gcd' or .='lcm') and"
  - "(parent::m:apply-function or following-sibling::*[1][.='⁡'] or"
  - " (not(preceding-sibling::*) and parent::*[self::m:munder or self::m:munderover or self::m:msub or self::m:msubsup or self::m:indexed-by]))"   # no "m sub min"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: "el"]      # phrase('el' máximo de a coma b)
  - test:
    - if: ".='max' or .='máx'"
      then: [T: "máximo"]      # phrase(el 'máximo' de a coma b)
    - else_if: ".='min' or .='mín'"
      then: [T: "mínimo"]      # phrase(el 'mínimo' de a coma b)
    - else_if: ".='mcd' or .='gcd'"
      then: [T: "máximo común divisor"]      # phrase(el 'máximo común divisor' de 28 y 34)
      else: [T: "mínimo común múltiplo"]      # phrase(el 'mínimo común múltiplo' de 4 y 6)

- name: ratio
  # razón inferida de "a ∶ b" (Rules/Intent/general.yaml): se lee "20 es a 5", como en MathCAT 0.7.7
  tag: ratio
  match: "count(*)=2"
  replace:
  - x: "*[1]"
  - T: "es a"      # phrase(20 'es a' 5)
  - x: "*[2]"

-
  name: log    # handle log, principal Log, and ln (if in an mrow, 'intents' are used)
  tag: mi
  match: ".='log' or .='Log' or .='ln'"
  replace:
  - bookmark: "@id"
  - test:
    - if: "$Verbosity!='Terse'"
      then: [OT: "el"]      # phrase('el' logaritmo de x)
  - test:
    - if: ".= 'log' and $Verbosity='Terse'"
      then: [T: "log"]
    - else_if: ".= 'log'"
      then: [T: "logaritmo"]      # phrase(el 'logaritmo' de x)
    - else_if: ".= 'Log'"
      then: [T: "logaritmo principal"]
    - else_if: "$Verbosity='Terse'"
      then: [spell: "'ln'"]
      else: [T: "logaritmo natural"]      # phrase(el 'logaritmo natural' de x)

- name: multi-line
  #   that eliminates the need for the if: else_if: ...
  # IDEA:  set a variable with the word to say for the row (e.g., RowLabel = Row/Case/Line/...)
  tag: [piecewise, system-of-equations, lines]
  match: "."
  variables:
    # Wikipedia has some tables where all the entire first column is empty (e.g., https://en.wikipedia.org/wiki/List_of_trigonometric_identities)
  - LineCount: "count(*[not(contains(@data-intent-property, ':continued-row:'))])"
  - NextLineIsContinuedRow: "false()"   # default value
  - IsColumnSilent: true()
  replace:
  - x: "$LineCount"
  - test:
    - if: "self::m:piecewise"
      then_test:
        if: "$LineCount = 1"
        then: [T: "caso"]      # phrase(1 'caso')
        else: [T: "casos"]     # phrase(3 'casos')
    - else_if: "self::m:system-of-equations"
      then_test:
        if: "$LineCount = 1"
        then: [T: "ecuación"]      # phrase(1 'ecuación')
        else: [T: "ecuaciones"]    # phrase(3 'ecuaciones')
      else_test:
        if: "$LineCount = 1"
        then: [T: "línea"]      # phrase(1 'línea')
        else: [T: "líneas"]     # phrase(3 'líneas')
  - pause: short
  - x: "*"
  - pause: long

- name: default-multiline
  tag: [mtr, mlabeledtr]
  match: "parent::m:piecewise or parent::m:system-of-equations or parent::m:lines"
  variables: [NextLineIsContinuedRow: "following-sibling::*[1][contains(@data-intent-property, ':continued-row:')]"]
  replace:
  - test:
      if: "not($LineCount=1 or contains(@data-intent-property, ':continued-row:'))"
      then:
      - pause: medium
      - test:
        - if: "parent::m:piecewise"
          then: [T: "caso"]     # phrase('caso' 1 de 10)
        - else_if: "parent::m:system-of-equations"
          then: [T: "ecuación"] # phrase('ecuación' 1 de 10)
          else: [T: "línea"]     # phrase('línea' 1 de 10)
      - x: "count(preceding-sibling::*[not(contains(@data-intent-property, ':continued-row:'))]) + 1"
  - test:
      if: "self::m:mlabeledtr"
      then:
      - T: "con etiqueta"      # phrase(fila 1 'con etiqueta' (3.1))
      - x: "*[1]/*"
  - test:
      if: "not(contains(@data-intent-property, ':continued-row:'))"
      then: [pause: medium]
  - test:
      if: "self::m:mlabeledtr"
      then: [x: "*[position()>1]"]
      else: [x: "*"]

- name: default-multiline
  tag: mtd
  match: "parent::*[parent::m:piecewise or parent::m:system-of-equations or parent::m:lines]"
  variables: [LongPause: "$SpeechStyle = 'ClearSpeak' and $ClearSpeak_MultiLinePausesBetweenColumns = 'Long'"]
  replace:
  - test:
      if: "IsInDefinition(*[1], 'ComparisonOperators')"
      then: [pause: short]
  - test:
      if: "*[1][@data-added!='missing-content']"
      then: [x: "*"]
  - test:
    # no pause after each element; medium pause if last element in a row; long pause for last element in matrix unless ClearSpeak override
    - if: "count(following-sibling::*) = 0 and not($NextLineIsContinuedRow)"
      then_test:
          if: "count(../following-sibling::*) > 0"
          then_test:
              if: "$LongPause"
              then: [pause: long]
              else: [pause: medium]
      else_test:
          if: "IsInDefinition(*[1], 'ComparisonOperators')"
          then: [pause: short]
          else: [pause: auto]

# Matrix/Determinant rules
# matrix and determinant are the same other than "matrix"/"determinant" based on the bracketing chars
# the pausing logic is pushed down to the <mtd>
# the rules either speak the <mtr>s (to get "row n") or the <mtd>s. "column n" spoken if $IsColumnSilent is false
# en español el sustantivo va primero: "la matriz 2 por 2", "la matriz columna 3 por 1"
- name: 1x1-matrix
  tag: [matrix, determinant]
  variables: [IsColumnSilent: true()]
  match: "count(*)=1 and *[self::m:mtr][count(*) = 1]"
  replace:
  - test:
      if: "self::m:determinant" # just need to check the first bracket since we know it must be (, [, or |
      then: [OT: "el", T: "determinante"]      # phrase('el determinante' 1 por 1)
      else: [OT: "la", T: "matriz"]      # phrase('la matriz' 1 por 1)
  - T: "1 por 1"      # phrase(la matriz '1 por 1')
  - T: "con elemento"      # phrase(la matriz 1 por 1 'con elemento' x)
  - x: "*[1]/*"

# simpler reading methods for special case matrices
- name: zero-matrix
  tag: matrix
  # select all the non-zero entries -- if there are none of them, then it is a zero matrix
  match: "not( */*/*[not(self::m:mn and .= 0)] )"
  replace:
  - T: "la matriz nula"   # phrase('la matriz nula' 2 por 2)
  - x: count(*)
  - T: "por"       # phrase(la matriz 1 'por' 2)
  - x: count(*[self::m:mtr][1]/*)
  - pause: long

- name: identity-matrix
  tag: matrix
  # every diagonal entry must be a literal 1, and every off-diagonal entry must be a literal 0
  match:
  - "count(*) = count(*[1]/*) and " # matrix is square
  - "not( */*[count(preceding-sibling::*) = count(../preceding-sibling::*)]/*[not(self::m:mn and .= 1)] ) and " # on-diagonal
  - "not( */*[count(preceding-sibling::*) != count(../preceding-sibling::*)]/*[not(self::m:mn and .= 0)] )" # off-diagonal
  replace:
  - T: "la matriz identidad"   # phrase('la matriz identidad' 2 por 2)
  - x: count(*)
  - T: "por"       # phrase(la matriz 1 'por' 2)
  - x: count(*[self::m:mtr][1]/*)
  - pause: long

- name: diagonal-matrix
  tag: matrix
  # select all the non-zero entries...if they are not on the diagonal
  #   if there are any of them, then this isn't an identity matrix
  match:
  - "count(*) = count(*[1]/*) and "
  - "not( */*/*[not(self::m:mn and .= 0)]"
  - "          [count(../preceding-sibling::*)!=count(../../preceding-sibling::*)]"
  - "    )"
  replace:
  - T: "la matriz diagonal"   # phrase('la matriz diagonal' 2 por 2)
  - x: count(*)
  - T: "por"       # phrase(la matriz 1 'por' 2)
  - x: count(*[self::m:mtr][1]/*)
  - pause: long
  - insert:
      # this lists the diagonal 'mtd's to be read, and they say "column nnn" before reading the contents
      # there seems to be an xpath bug -- without the parens, the match fails for the
      #   test Languages::en::mtable::diagonal_matrix due to match failure (the third matching element seems to be missing)
      nodes: "(*/*/*[not(self::m:mn and .= 0)]/..)"
      replace: [pause: auto]
  - pause: long

# simpler reading methods for smaller matrices if the entries are simple
- name: 2-or-3x1-matrix
  tag: matrix
  variables: [IsColumnSilent: true()]
  match:
  - "$ClearSpeak_Matrix != 'SpeakColNum' and " # "simple" isn't used for this preference
  - "*[self::m:mtr][count(*) = 1] and " # one column
  - count(*)<=3 and # at least two rows
  - IsNode(*/*/*,'simple') # IsNode() returns true if all the nodes are simple
  replace:
  - test:
      if: "$ClearSpeak_Matrix = 'Vector' or $ClearSpeak_Matrix = 'EndVector'"
      then: [T: "el vector columna"]      # phrase('el vector columna' 3 por 1)
      else: [T: "la matriz columna"]      # phrase('la matriz columna' 3 por 1)
  - x: count(*)
  - T: "por 1"      # phrase(la matriz columna 2 'por 1')
  - pause: long
  - x: "*/*"
  - test:
      if: "$ClearSpeak_Matrix = 'EndMatrix' or $ClearSpeak_Matrix = 'EndVector'"
      then:
      - test:
        - if: "self::m:determinant"
          then: [T: "fin del determinante"]      # phrase('fin del determinante')
        - else_if: "$ClearSpeak_Matrix = 'EndVector'"
          then: [T: "fin del vector"]      # phrase('fin del vector')
          else: [T: "fin de la matriz"]      # phrase('fin de la matriz')

- name: default-column-matrix
  tag: matrix
  variables: [IsColumnSilent: true()]
  match: "*[self::m:mtr][count(*) = 1]"
  replace:
  - test:
      if: "$ClearSpeak_Matrix = 'Vector' or $ClearSpeak_Matrix = 'EndVector'"
      then: [T: "el vector columna"]      # phrase('el vector columna' 3 por 1)
      else: [T: "la matriz columna"]      # phrase('la matriz columna' 3 por 1)
  - x: "count(*)"
  - T: "por 1"      # phrase(la matriz columna 2 'por 1')
  - pause: long
  - x: "*" # select the rows (mtr)
  - test:
      if: "$ClearSpeak_Matrix = 'EndMatrix' or $ClearSpeak_Matrix = 'EndVector'"
      then:
      - test:
        - if: "self::m:determinant"
          then: [T: "fin del determinante"]      # phrase('fin del determinante')
        - else_if: "$ClearSpeak_Matrix = 'EndVector'"
          then: [T: "fin del vector"]      # phrase('fin del vector')
          else: [T: "fin de la matriz"]      # phrase('fin de la matriz')

- name: 1x2-or-3-matrix
  tag: matrix
  variables: [IsColumnSilent: "$SpeechStyle = 'SimpleSpeak' or ($SpeechStyle = 'ClearSpeak' and $ClearSpeak_Matrix != 'SpeakColNum')"]
  match:
  - "$ClearSpeak_Matrix != 'SpeakColNum' and " # "simple" isn't used for this preference
  - count(*)=1  and # one row
  - count(*[1]/*)<=3 and # at least two cols
  - IsNode(*/*/*,'simple') # IsNode() returns true if all the nodes are simple
  replace:
  - test:
      if: "$ClearSpeak_Matrix = 'Vector' or $ClearSpeak_Matrix = 'EndVector'"
      then: [T: "el vector fila"]      # phrase('el vector fila' 3 por 1)
      else: [T: "la matriz fila"]      # phrase('la matriz fila' 3 por 1)
  - T: "1 por"      # phrase(la matriz fila '1 por' 2)
  - x: count(*/*)
  - pause: long
  - x: "*/*"
  - test:
      if: "$ClearSpeak_Matrix = 'EndMatrix' or $ClearSpeak_Matrix = 'EndVector'"
      then:
      - test:
        - if: "self::m:determinant"
          then: [T: "fin del determinante"]      # phrase('fin del determinante')
        - else_if: "$ClearSpeak_Matrix = 'EndVector'"
          then: [T: "fin del vector"]      # phrase('fin del vector')
          else: [T: "fin de la matriz"]      # phrase('fin de la matriz')

- name: default-row-matrix
  tag: matrix
  variables: [IsColumnSilent: "$SpeechStyle = 'ClearSpeak' and $ClearSpeak_Matrix = 'SilentColNum'"]
  match: "count(*)=1" # one row
  replace:
  - test:
      if: "$ClearSpeak_Matrix = 'Vector' or $ClearSpeak_Matrix = 'EndVector'"
      then: [T: "el vector fila"]      # phrase('el vector fila' 3 por 1)
      else: [T: "la matriz fila"]      # phrase('la matriz fila' 3 por 1)
  - T: "1 por"      # phrase(la matriz fila '1 por' 2)
  - x: "count(*/*)"
  - pause: long
  - pause: medium
  - x: "*/*" # select the cols (mtd)
  - test:
      if: "$ClearSpeak_Matrix = 'EndMatrix' or $ClearSpeak_Matrix = 'EndVector'"
      then:
      - test:
        - if: "self::m:determinant"
          then: [T: "fin del determinante"]      # phrase('fin del determinante')
        - else_if: "$ClearSpeak_Matrix = 'EndVector'"
          then: [T: "fin del vector"]      # phrase('fin del vector')
          else: [T: "fin de la matriz"]      # phrase('fin de la matriz')

- name: simple-small-matrix
  tag: [matrix, determinant]
  match:
  - "$ClearSpeak_Matrix != 'SpeakColNum' and " # "simple" isn't used for this preference
  - (count(*)<=3 and count(*[1]/*)<=3) and # no bigger than a 3x3 matrix
  - IsNode(*/*/*,'simple') # IsNode() returns true if all the nodes are simple
  variables: [IsColumnSilent: "$SpeechStyle = 'SimpleSpeak' or ($SpeechStyle = 'ClearSpeak' and $ClearSpeak_Matrix != 'SpeakColNum')"]
  replace:
  - test:
      if: "self::m:determinant"
      then: [T: "el determinante"]      # phrase('el determinante' 2 por 2)
      else_test:
        if: "@columnlines and (contains(normalize-space(@columnlines), 'solid') or contains(normalize-space(@columnlines), 'dashed'))"
        then: [T: "la matriz ampliada"]      # phrase('la matriz ampliada' 2 por 3)
        else: [T: "la matriz"]      # phrase('la matriz' 2 por 2)
  - x: count(*)
  - T: "por"      # phrase(la matriz 1 'por' 2)
  - x: count(*[self::m:mtr][1]/*)
  - pause: long
  - x: "*"
  - test:
      if: "$ClearSpeak_Matrix = 'EndMatrix' or $ClearSpeak_Matrix = 'EndVector'"
      then:
      - test:
        - if: "self::m:determinant"
          then: [T: "fin del determinante"]      # phrase('fin del determinante')
        - else_if: "$ClearSpeak_Matrix = 'EndVector'"
          then: [T: "fin del vector"]      # phrase('fin del vector')
          else: [T: "fin de la matriz"]      # phrase('fin de la matriz')

- name: default-matrix
  tag: [matrix, determinant]
  variables: [IsColumnSilent: "$SpeechStyle = 'ClearSpeak' and $ClearSpeak_Matrix = 'SilentColNum'"]
  match: "."
  replace:
  - test:
      if: "self::m:determinant"
      then: [T: "el determinante"]      # phrase('el determinante' 2 por 2)
      else_test:
        if: "@columnlines and (contains(normalize-space(@columnlines), 'solid') or contains(normalize-space(@columnlines), 'dashed'))"
        then: [T: "la matriz ampliada"]      # phrase('la matriz ampliada' 2 por 3)
        else: [T: "la matriz"]      # phrase('la matriz' 2 por 2)
  - x: "count(*)"
  - T: "por"      # phrase(la matriz 1 'por' 2)
  - x: "count(*[self::m:mtr][1]/*)"
  - pause: long
  - x: "*"
  - test:
      if: "$ClearSpeak_Matrix = 'EndMatrix' or $ClearSpeak_Matrix = 'EndVector'"
      then:
      - test:
        - if: "self::m:determinant"
          then: [T: "fin del determinante"]      # phrase('fin del determinante')
        - else_if: "$ClearSpeak_Matrix = 'EndVector'"
          then: [T: "fin del vector"]      # phrase('fin del vector')
          else: [T: "fin de la matriz"]      # phrase('fin de la matriz')

- name: chemistry-msub

  tag: [chemical-formula]
  match: "*[1][.='msub']"
  replace:
  - x: "*[2]"
  - test:
      if: "$Verbosity='Verbose'"
      then: [T: "subíndice"]
      else_test:
        if: "$Verbosity='Medium'"
        then: [T: "sub"]
  - x: "*[3]"

- name: dimension-by
  tag: mrow
  match: dimension-product
  replace:
  - insert:
      nodes: "*"
      replace: [T: "por", pause: auto]      # phrase(matriz de 3 'por' 5)

- name: chemistry-msup
  tag: [chemical-formula]
  match: "count(*)=3 and *[1][.='msup']"
  replace:
  - x: "*[2]"
  - test:
      if: "$Verbosity='Verbose'"
      then: [T: "superíndice"]
      else_test:
        if: "$Verbosity='Medium'"
        then: [T: "superíndice"]
  - x: "*[3]"
  - test:
      if: "following-sibling::*[1][.='+' or .='-']" # a little lazy -- assumes chemistry superscripts end with + or -
      then: [pause: medium]

-
  # There currently is no way to do sub/super for n-ary number of args
  # Instead, we just deal with up to two prescripts and up to four postscripts (repeating blocks of similar code [UGLY!])
  # This hopefully covers all reasonable cases...
  name: chemistry-scripts
  tag: [chemical-formula, chemical-nuclide]
  variables:
  # computing the number of postscripts is messy because of <mprescripts> being optionally present -- we use "mod" to get the count right
  - Prescripts: "m:mprescripts/following-sibling::*"
  - NumChildren: "count(*)" # need to stash this since the count is wrong inside '*[...]' below
  - Postscripts: "*[position()>1 and position() < (last() + ($NumChildren mod 2) -count($Prescripts))]"
  match: . # should only be msubsup or mmultiscripts at this point
  replace:
  - test:
      if: "$Prescripts" # we have at least one pre sub/super 
      then:
      # nuclide: speak the superscript first
      - test:
          if: "not($Prescripts[2][self::m:none])"
          then:
          - test:
              if: "$Verbosity='Verbose'"
              then: [T: "superíndice"]
              else_test:
                if: "$Verbosity='Medium'"
                then: [T: "superíndice"]
          - x: "$Prescripts[2]"
          - pause: "short"
      - test:
          if: "not($Prescripts[1][self::m:none])"
          then:
          - test:
              if: "$Verbosity='Verbose'"
              then: [T: "subíndice"]
              else_test:
                if: "$Verbosity='Medium'"
                then: [T: "sub"]
          - x: "$Prescripts[1]"
          - pause: "short"
      - test:
          if: "count($Prescripts) > 2" # can this happen for chemistry??? we allow for one *extra* pre sub/super pair
          then:
          - test:
              if: "not($Prescripts[4][self::m:none])"
              then:
              - test:
                  if: "$Verbosity='Verbose'"
                  then: [T: "subíndice"]
                  else_test:
                    if: "$Verbosity='Medium'"
                    then: [T: "superíndice"]
              - x: "$Prescripts[4]"
              - pause: "short"
          - test:
              if: "not($Prescripts[3][self::m:none])"
              then:
              - test:
                  if: "$Verbosity='Verbose'"
                  then: [T: "subíndice"]
                  else_test:
                    if: "$Verbosity='Medium'"
                    then: [T: "sub"]
              - x: "$Prescripts[3]"
              - pause: "short"
  - x: "*[1]" # base
  - test:
      if: "$Postscripts"
      then:
      - test:
          if: "not($Postscripts[1][self::m:none])"
          then:
          - test:
              if: "$Verbosity='Verbose'"
              then: [T: "subíndice"]
              else_test:
                if: "$Verbosity='Medium'"
                then: [T: "sub"]
          - x: "$Postscripts[1]"
          - pause: "short"
      - test:
          if: "not($Postscripts[2][self::m:none])"
          then:
          - test:
              if: "$Verbosity='Verbose'"
              then: [T: "superíndice"]
              else_test:
                if: "$Verbosity='Medium'"
                then: [T: "superíndice"]
          - x: "$Postscripts[2]"
          - pause: "short"
      - test:
          if: "count($Postscripts) > 2"
          then:
          - test:
              if: "not($Postscripts[3][self::m:none])"
              then:
              - test:
                  if: "$Verbosity='Verbose'"
                  then: [T: "subíndice"]
                  else_test:
                    if: "$Verbosity='Medium'"
                    then: [T: "sub"]
              - x: "$Postscripts[3]"
              - pause: "short"
          - test:
              if: "not($Postscripts[4][self::m:none])"
              then:
              - test:
                  if: "$Verbosity='Verbose'"
                  then: [T: "superíndice"]
                  else_test:
                    if: "$Verbosity='Medium'"
                    then: [T: "superíndice"]
              - x: "$Postscripts[4]"
              - pause: "short"
          - test:
              if: "count($Postscripts) > 4"
              then:
              - test:
                  if: "not($Postscripts[5][self::m:none])"
                  then:
                  - test:
                      if: "$Verbosity='Verbose'"
                      then: [T: "subíndice"]
                      else_test:
                        if: "$Verbosity='Medium'"
                        then: [T: "sub"]
                  - x: "$Postscripts[5]"
                  - pause: "short"
              - test:
                  if: "not($Postscripts[6][self::m:none])"
                  then:
                  - test:
                      if: "$Verbosity='Verbose'"
                      then: [T: "superíndice"]
                      else_test:
                        if: "$Verbosity='Medium'"
                        then: [T: "superíndice"]
                  - x: "$Postscripts[6]"
                  - pause: "short"
              - test:
                  if: "count($Postscripts) > 6"
                  then:
                  - test:
                      if: "not($Postscripts[7][self::m:none])"
                      then:
                      - test:
                          if: "$Verbosity='Verbose'"
                          then: [T: "subíndice"]
                          else_test:
                            if: "$Verbosity='Medium'"
                            then: [T: "sub"]
                      - x: "$Postscripts[7]"
                      - pause: "short"
                  - test:
                      if: "not($Postscripts[8][self::m:none])"
                      then:
                      - test:
                          if: "$Verbosity='Verbose'"
                          then: [T: "superíndice"]
                          else_test:
                            if: "$Verbosity='Medium'"
                            then: [T: "superíndice"]
                      - x: "$Postscripts[8]"
                      - pause: "short"
      - test:
          if: "$Postscripts[last()][not(self::m:none)] and following-sibling::*[1][.='+' or .='-']"
          then: [pause: medium]

- name: chemistry


  tag: chemical-equation
  match: "."
  replace:
  - x: "*"

- name: chemical-element
  tag: chemical-element
  match: "."
  replace:
  - bookmark: "@id"
  - spell: text()
  - pause: short

- name: chemical-state
  tag: chemical-state
  match: "count(*)=1"
  replace:
  - bookmark: "*[1]/@id"
  - test:
    - if: ".='s'"
      then: [T: "sólido"]
    - else_if: ".='l'"
      then: [T: "líquido"]
    - else_if: ".='g'"
      then: [T: "gaseoso"]
      else: [T: "acuoso"] # (aq)
  - pause: short

- name: chemical-formula-operator-bond
  tag: chemical-formula-operator
  match: "@data-chemical-bond"
  replace:
  # FIX: this might be better/more efficient if in unicode.yaml
  - bookmark: "@id"
  - test:
    - if: ".='-' or .=':'"
      then: [T: "enlace simple"]      # phrase(un 'enlace simple' entre dos átomos)
    - else_if: ".='=' or .='∷'"
      then: [T: "doble enlace"]
    - else_if: ".='≡'"
      then: [T: "triple enlace"]
    - else_if: ".='≣'"
      then: [T: "cuádruple enlace"]
      else: [x: "text()"]

- name: chemical-formula-operator
  tag: chemical-formula-operator
  match: "."
  replace:
    x: "text()"

- name: chemical-arrow-operator
  tag: chemical-arrow-operator
  match: "."
  replace:
  # FIX: this might be better/more efficient if in unicode.yaml
  - bookmark: "@id"
  - test:
    - if: ".='→' or .='⟶'"
      then_test:
        if: "$Verbosity='Terse'"
        then: [T: "forma"]      # phrase(hidrógeno y oxígeno 'forma' agua)
        else: [T: "reacciona para formar"]      # phrase(hidrógeno y oxígeno 'reacciona para formar' agua)
    - else_if: ".='⇌' or .='🣑'" # U+01F8D1
      then: [T: "está en equilibrio con"]
    - else_if: ".='🣓'" # U+1F8D3
      then: [T: "está en equilibrio desplazado a la izquierda con"]
    - else_if: ".='🣒'" # U+1F8D2
      then: [T: "está en equilibrio desplazado a la derecha con"]
      else: [x: "*"]

- name: chemical-equation-operator
  tag: chemical-equation-operator
  match: "."
  replace:
  - bookmark: "@id"
  - x: "text()"

- name: none
  tag: none
  match: "../../*[self::m:chemical-formula or self::m:chemical-nuclide]"
  replace:
  - t: "" # don't say anything

- name: ignore-intent-wrapper
  tag: intent-wrapper
  match: "."
  replace:
  - x: "*"
