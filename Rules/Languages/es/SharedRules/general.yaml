- name: chemistry-msub

  tag: [chemical-formula]
  match: "*[1][.='msub']"
  replace:
  - x: "*[2]"
  - test:
      if: "$Verbosity='Verbose'"
      then: [T: "subíndice"]
      else_test:
        if: "$Verbosity='Medium'"
        then: [T: "sub"]
  - x: "*[3]"

- name: dimension-by
  tag: mrow
  match: dimension-product
  replace:
  - insert:
      nodes: "*"
      replace: [T: "por", pause: auto]      # phrase(matriz de 3 'por' 5)

- name: chemistry-msup
  tag: [chemical-formula]
  match: "count(*)=3 and *[1][.='msup']"
  replace:
  - x: "*[2]"
  - test:
      if: "$Verbosity='Verbose'"
      then: [T: "superíndice"]
      else_test:
        if: "$Verbosity='Medium'"
        then: [T: "superíndice"]
  - x: "*[3]"
  - test:
      if: "following-sibling::*[1][.='+' or .='-']" # a little lazy -- assumes chemistry superscripts end with + or -
      then: [pause: medium]

-
  # There currently is no way to do sub/super for n-ary number of args
  # Instead, we just deal with up to two prescripts and up to four postscripts (repeating blocks of similar code [UGLY!])
  # This hopefully covers all reasonable cases...
  name: chemistry-scripts
  tag: [chemical-formula, chemical-nuclide]
  variables:
  # computing the number of postscripts is messy because of <mprescripts> being optionally present -- we use "mod" to get the count right
  - Prescripts: "m:mprescripts/following-sibling::*"
  - NumChildren: "count(*)" # need to stash this since the count is wrong inside '*[...]' below
  - Postscripts: "*[position()>1 and position() < (last() + ($NumChildren mod 2) -count($Prescripts))]"
  match: . # should only be msubsup or mmultiscripts at this point
  replace:
  - test:
      if: "$Prescripts" # we have at least one pre sub/super 
      then:
      # nuclide: speak the superscript first
      - test:
          if: "not($Prescripts[2][self::m:none])"
          then:
          - test:
              if: "$Verbosity='Verbose'"
              then: [T: "superíndice"]
              else_test:
                if: "$Verbosity='Medium'"
                then: [T: "superíndice"]
          - x: "$Prescripts[2]"
          - pause: "short"
      - test:
          if: "not($Prescripts[1][self::m:none])"
          then:
          - test:
              if: "$Verbosity='Verbose'"
              then: [T: "subíndice"]
              else_test:
                if: "$Verbosity='Medium'"
                then: [T: "sub"]
          - x: "$Prescripts[1]"
          - pause: "short"
      - test:
          if: "count($Prescripts) > 2" # can this happen for chemistry??? we allow for one *extra* pre sub/super pair
          then:
          - test:
              if: "not($Prescripts[4][self::m:none])"
              then:
              - test:
                  if: "$Verbosity='Verbose'"
                  then: [T: "subíndice"]
                  else_test:
                    if: "$Verbosity='Medium'"
                    then: [T: "superíndice"]
              - x: "$Prescripts[4]"
              - pause: "short"
          - test:
              if: "not($Prescripts[3][self::m:none])"
              then:
              - test:
                  if: "$Verbosity='Verbose'"
                  then: [T: "subíndice"]
                  else_test:
                    if: "$Verbosity='Medium'"
                    then: [T: "sub"]
              - x: "$Prescripts[3]"
              - pause: "short"
  - x: "*[1]" # base
  - test:
      if: "$Postscripts"
      then:
      - test:
          if: "not($Postscripts[1][self::m:none])"
          then:
          - test:
              if: "$Verbosity='Verbose'"
              then: [T: "subíndice"]
              else_test:
                if: "$Verbosity='Medium'"
                then: [T: "sub"]
          - x: "$Postscripts[1]"
          - pause: "short"
      - test:
          if: "not($Postscripts[2][self::m:none])"
          then:
          - test:
              if: "$Verbosity='Verbose'"
              then: [T: "superíndice"]
              else_test:
                if: "$Verbosity='Medium'"
                then: [T: "superíndice"]
          - x: "$Postscripts[2]"
          - pause: "short"
      - test:
          if: "count($Postscripts) > 2"
          then:
          - test:
              if: "not($Postscripts[3][self::m:none])"
              then:
              - test:
                  if: "$Verbosity='Verbose'"
                  then: [T: "subíndice"]
                  else_test:
                    if: "$Verbosity='Medium'"
                    then: [T: "sub"]
              - x: "$Postscripts[3]"
              - pause: "short"
          - test:
              if: "not($Postscripts[4][self::m:none])"
              then:
              - test:
                  if: "$Verbosity='Verbose'"
                  then: [T: "superíndice"]
                  else_test:
                    if: "$Verbosity='Medium'"
                    then: [T: "superíndice"]
              - x: "$Postscripts[4]"
              - pause: "short"
          - test:
              if: "count($Postscripts) > 4"
              then:
              - test:
                  if: "not($Postscripts[5][self::m:none])"
                  then:
                  - test:
                      if: "$Verbosity='Verbose'"
                      then: [T: "subíndice"]
                      else_test:
                        if: "$Verbosity='Medium'"
                        then: [T: "sub"]
                  - x: "$Postscripts[5]"
                  - pause: "short"
              - test:
                  if: "not($Postscripts[6][self::m:none])"
                  then:
                  - test:
                      if: "$Verbosity='Verbose'"
                      then: [T: "superíndice"]
                      else_test:
                        if: "$Verbosity='Medium'"
                        then: [T: "superíndice"]
                  - x: "$Postscripts[6]"
                  - pause: "short"
              - test:
                  if: "count($Postscripts) > 6"
                  then:
                  - test:
                      if: "not($Postscripts[7][self::m:none])"
                      then:
                      - test:
                          if: "$Verbosity='Verbose'"
                          then: [T: "subíndice"]
                          else_test:
                            if: "$Verbosity='Medium'"
                            then: [T: "sub"]
                      - x: "$Postscripts[7]"
                      - pause: "short"
                  - test:
                      if: "not($Postscripts[8][self::m:none])"
                      then:
                      - test:
                          if: "$Verbosity='Verbose'"
                          then: [T: "superíndice"]
                          else_test:
                            if: "$Verbosity='Medium'"
                            then: [T: "superíndice"]
                      - x: "$Postscripts[8]"
                      - pause: "short"
      - test:
          if: "$Postscripts[last()][not(self::m:none)] and following-sibling::*[1][.='+' or .='-']"
          then: [pause: medium]

- name: chemistry


  tag: chemical-equation
  match: "."
  replace:
  - x: "*"

- name: chemical-element
  tag: chemical-element
  match: "."
  replace:
  - bookmark: "@id"
  - spell: text()
  - pause: short

- name: chemical-state
  tag: chemical-state
  match: "count(*)=1"
  replace:
  - bookmark: "*[1]/@id"
  - test:
    - if: ".='s'"
      then: [T: "sólido"]
    - else_if: ".='l'"
      then: [T: "líquido"]
    - else_if: ".='g'"
      then: [T: "gaseoso"]
      else: [T: "acuoso"] # (aq)
  - pause: short

- name: chemical-formula-operator-bond
  tag: chemical-formula-operator
  match: "@data-chemical-bond"
  replace:
  # FIX: this might be better/more efficient if in unicode.yaml
  - bookmark: "@id"
  - test:
    - if: ".='-' or .=':'"
      then: [T: "enlace simple"]      # phrase(un 'enlace simple' entre dos átomos)
    - else_if: ".='=' or .='∷'"
      then: [T: "enlace doble"]      # ONCE B 6-1, 8.1.2
    - else_if: ".='≡'"
      then: [T: "enlace triple"]
    - else_if: ".='≣'"
      then: [T: "enlace cuádruple"]
      else: [x: "text()"]

- name: chemical-formula-operator
  tag: chemical-formula-operator
  match: "."
  replace:
    x: "text()"

- name: chemical-arrow-operator
  tag: chemical-arrow-operator
  match: "."
  replace:
  # FIX: this might be better/more efficient if in unicode.yaml
  - bookmark: "@id"
  - test:
    - if: ".='→' or .='⟶'"
      then_test:
        if: "$Verbosity='Terse'"
        then: [T: "da"]      # phrase(hidrógeno más oxígeno 'da' agua)
        else: [T: "produce"]      # phrase(hidrógeno más oxígeno 'produce' agua) (SEP, EcuRed)
    - else_if: ".='⇌' or .='🣑' or .='⇄' or .='⇆'" # U+01F8D1; ⇄ ⇆ también son equilibrio (ONCE B 6-1, 6.3)
      then: [T: "está en equilibrio con"]
    - else_if: ".='🣓'" # U+1F8D3
      then: [T: "está en equilibrio desplazado a la izquierda con"]
    - else_if: ".='🣒'" # U+1F8D2
      then: [T: "está en equilibrio desplazado a la derecha con"]
      else: [x: "*"]

- name: chemical-gas-precipitate-hydrate
  # CO₂↑, CaCO₃↓ y el punto de los hidratos (ONCE B 6-1, 6.5, 6.6 y 8.2.2; SEP)
  tag: [chemical-equation-operator, chemical-formula-operator]
  match: ".='↑' or .='↓' or .='·' or .='⋅' or .='⇄' or .='⇆'"
  replace:
  - bookmark: "@id"
  - test:
    - if: ".='↑'"
      then: [T: "desprendimiento gaseoso"]      # phrase(c o 2 'desprendimiento gaseoso')
    - else_if: ".='↓'"
      then: [T: "precipitado"]      # phrase(c a c o 3 'precipitado')
    - else_if: ".='⇄' or .='⇆'"
      then: [T: "está en equilibrio con"]      # ONCE B 6-1, 6.3
      else: [T: "punto"]      # phrase(n a 2 s o 4 'punto' 5 h 2 o)

- name: chemical-arrow-with-heat
  # → con Δ encima: "produce con calor" (SEP, EcuRed)
  tag: mover
  match: "*[1][self::m:chemical-arrow-operator] and *[2][.='Δ' or .='∆']"
  replace:
  - x: "*[1]"
  - T: "con calor"      # phrase(c a c o 3 produce 'con calor' c a o)

- name: chemical-equation-operator
  tag: chemical-equation-operator
  match: "."
  replace:
  - bookmark: "@id"
  - x: "text()"

- name: none
  tag: none
  match: "../../*[self::m:chemical-formula or self::m:chemical-nuclide]"
  replace:
  - t: "" # don't say anything

- name: ignore-intent-wrapper
  tag: intent-wrapper
  match: "."
  replace:
  - x: "*"
