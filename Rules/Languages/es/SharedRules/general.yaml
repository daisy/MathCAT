---

# Parentheses that only group a unit numerator or denominator. Canonicalize sets data-unit-grouping;
# the nodes stay in the tree for braille. Literal speech still reads them.
- name: unit-grouping-paren
  tag: mo
  match: "@data-unit-grouping and not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')])"
  replace:
  - t: ""

# number-sets are a little messy in that the base was converted to a number-set, so we have to match that (simple) case last

# Hora y fecha con intent (":time", ":date"): MathCAT las dice en palabras para que el texto,
# cualquier voz y el braille digan lo mismo. Base: la lectura de la voz del MathCAT Demo
# ("las nueve y media", "las doce y 21 de la noche", "uno de enero de dos mil").
- name: hora
  tag: [mtext, mn, mi]
  match: "contains(@data-intent-property, ':time:') and not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')]) and
          string-length(substring-before(translate(., ' ', ''), ':')) >= 1 and
          string-length(substring-before(translate(., ' ', ''), ':')) <= 2"
  variables:
  - T: "translate(., ' ', '')"
  - Resto: "substring-after(translate(., ' ', ''), ':')"
  - H: "number(substring-before(translate(., ' ', ''), ':'))"
  - M: "number(IfThenElse(contains(substring-after(translate(., ' ', ''), ':'), ':'), substring-before(substring-after(translate(., ' ', ''), ':'), ':'), substring-after(translate(., ' ', ''), ':')))"
  - S: "IfThenElse(contains(substring-after(translate(., ' ', ''), ':'), ':'), number(substring-after(substring-after(translate(., ' ', ''), ':'), ':')), -1)"
  replace:
  - bookmark: "@id"
  - test:
      # hora imposible (25:70) o mal escrita: se dice el texto tal cual
      if: "not($H >= 0 and $H < 24 and $M >= 0 and $M < 60 and $S < 60)"
      then: [x: "text()"]
      else:
      - test:
        - if: "$H = 1"
          then: [T: "la una"]                    # la una (no "la uno")
        - else_if: "$H = 0"
          then: [T: "las", x: "12"]              # 0:21 = las 12 y 21 de la noche
          else: [T: "las", x: "$H"]
      - test:
        - if: "$M = 0"
          then: []
        - else_if: "$H < 13 and $M = 15"
          then: [T: "y cuarto"]
        - else_if: "$H < 13 and $M = 30"
          then: [T: "y media"]
          else: [T: "y", x: "$M"]
      - test:
          if: "$H = 0"
          then: [T: "de la noche"]
      - test:
        - if: "$S = 1"
          then: [T: "con", x: "1", T: "segundo"]
        - else_if: "$S >= 0"
          then: [T: "con", x: "$S", T: "segundos"]

- name: fecha
  tag: [mtext, mn, mi]
  match: "contains(@data-intent-property, ':date:') and not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')]) and
          (contains(., '/') or contains(., '-'))"
  variables:
  - Sep: "IfThenElse(contains(., '/'), '/', '-')"
  replace:
  - with:
      variables:
      - P1: "substring-before(translate(., ' ', ''), $Sep)"
      - P2: "substring-before(substring-after(translate(., ' ', ''), $Sep), $Sep)"
      - P3: "substring-after(substring-after(translate(., ' ', ''), $Sep), $Sep)"
      replace:
      - with:
          variables:
          # año con 4 cifras al principio (1981-01-02) o al final (02/01/1981)
          - D: "number(IfThenElse(string-length($P1) = 4, $P3, $P1))"
          - Mes: "DefinitionValue(string(number($P2)), 'Speech', 'MonthNames')"
          - A: "number(IfThenElse(string-length($P1) = 4, $P1, $P3))"
          replace:
          - bookmark: "@id"
          - test:
              if: "$Mes != '' and $D >= 1 and $D <= 31 and (string-length($P1) = 4 or string-length($P3) = 4)"
              then: [x: "$D", T: "de", x: "$Mes", T: "de", x: "$A"]
              else: [x: "text()"]

- name: one-sided-limit
  # "x → 0⁻" se lee "x tiende a 0 por la izquierda"; "x → 0⁺", "x tiende a 0 por la derecha"
  tag: [say-super, msup, power]
  match: "*[2][self::m:mo][.='-' or .='−' or .='+'] and ancestor::*[2][self::m:limit or self::m:limit-sup or self::m:limit-inf or self::m:munder[starts-with(normalize-space(*[1]), 'lím')]]"
  replace:
  - x: "*[1]"
  - test:
      if: "*[2][.='+']"
      then: [T: "por la derecha"]      # phrase(x tiende a 0 'por la derecha')
      else: [T: "por la izquierda"]    # phrase(x tiende a 0 'por la izquierda')

- name: limite-con-tilde
  # "lím", "lím sup" y "lím inf" escritos con tilde: Rules/Intent solo reconoce "lim", así que se leen aquí
  tag: munder
  variables: [Base: "translate(*[1], ' \u00A0\u2061', '')"]
  match: "($Base='lím' or $Base='límsup' or $Base='líminf') and not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')])"   # en modo literal (navegación) se lee con las reglas generales
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: "el"]
  - test:
    - if: "$Base='límsup'"
      then: [T: "límite superior cuando"]
    - else_if: "$Base='líminf'"
      then: [T: "límite inferior cuando"]
      else: [T: "límite cuando"]
  - x: "*[2]"
  - pause: short

- name: pos-neg-number-sets
  # en español el adjetivo va después y concuerda: "los enteros negativos", "los números reales positivos"
  tag: number-sets
  match: "count(*)=2 and *[2][.='+' or .='-']"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: "los"]      # phrase('los' enteros positivos)
  - bookmark: "*[1]/@id"
  - test:
    - if: "*[1][.='ℂ']"
      then: [T: "números complejos"]
    - else_if: "*[1][.='ℕ']"
      then: [T: "números naturales"]
    - else_if: "*[1][.='ℚ']"
      then: [T: "números racionales"]
    - else_if: "*[1][.='ℝ']"
      then: [T: "números reales"]
    - else_if: "*[1][.='ℤ']"
      then: [T: "enteros"]
      else: [x: "*[1][text()]"] # shouldn't happen
  - bookmark: "*[2]/@id"
  - test:
    - if: "*[2][.='+']"
      then: [T: "positivos"]      # phrase(los enteros 'positivos')
      else: [T: "negativos"]      # phrase(los enteros 'negativos')

- name: dimension-number-sets

  # should be single digit integer at this point (e.g, R^3)
  tag: number-sets
  match: "count(*)=2"
  replace:
  - bookmark: "*[1]/@id"
  - test:
    - if: "*[1][.='ℂ']"
      then: [T: "C"]
    - else_if: "*[1][.='ℕ']"
      then: [T: "N"]
    - else_if: "*[1][.='ℚ']"
      then: [T: "Q"]
    - else_if: "*[1][.='ℝ']"
      then: [T: "R"]
    - else_if: "*[1][.='ℤ']"
      then: [T: "Z"]
      else: [x: "*[1][text()]"] # shouldn't happen
  - bookmark: "*[2]/@id"
  - x: "*[2]"

- name: simple-number-sets
  tag: number-sets
  match: "count(*)=0"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity!='Terse' and contains('ℂℕℚℝℤ', .)"
      then: [T: "los"]      # phrase('los' números reales); en modo breve sin artículo, como pos-neg-number-sets
  - test:
    - if: ".='ℂ'"
      then: [T: "números complejos"]
    - else_if: ".='ℕ'"
      then: [T: "números naturales"]
    - else_if: ".='ℚ'"
      then: [T: "números racionales"]
    - else_if: ".='ℝ'"
      then: [T: "números reales"]
    - else_if: ".='ℤ'"
      then: [T: "enteros"]
      else: [x: "text()"] # shouldn't happen

- name: real-part
  tag: real-part
  match: "count(*)=0"
  replace:
  - bookmark: "@id"
  - T: "la parte real"      # phrase('la parte real' de un número complejo)

- name: imaginary-part
  tag: imaginary-part
  match: "count(*)=0"
  replace:
  - bookmark: "@id"
  - T: "la parte imaginaria"      # phrase('la parte imaginaria' de un número complejo)

- name: evaluated-at-2
  tag: evaluate
  match: "count(*)=2"
  replace:
  - x: "*[1]"
  - pause: auto
  - T: evaluado en
  - pause: auto
  - x: "*[2]"

- name: evaluated-at-3
  tag: evaluate
  match: "count(*)=3"
  replace:
  - x: "*[1]"
  - pause: auto
  - T: "evaluado en"      # phrase(el resultado 'evaluado en' este punto)
  - pause: auto
  - x: "*[3]"
  - T: "menos la misma expresión evaluada en"      # phrase(esto 'menos la misma expresión evaluada en' un punto anterior)
  - x: "*[2]"

- name: permutation
  # Not a default because the order of the args is reversed
  tag: pochhammer
  match: "count(*)=2 and contains(@data-intent-property, ':infix:')"
  replace:
  - x: "*[2]"
  - T: "permutaciones de"      # phrase(varias 'permutaciones de' valores)
  - x: "*[1]"

- name: intervals
  tag: [open-interval, open-closed-interval, closed-interval, closed-open-interval]
  match: "count(*)=2"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then:
      - T: "el"
  - test:
    - if: "self::m:open-interval"
      then: [T: "intervalo abierto"]      # phrase(el 'intervalo abierto' de 0 a 1)
    - else_if: "self::m:closed-interval"
      then: [T: "intervalo cerrado"]      # phrase(el 'intervalo cerrado' de 0 a 1)
    - else_if: "self::m:open-closed-interval"
      then: [T: "intervalo abierto por la izquierda"]      # phrase(el 'intervalo abierto por la izquierda' de 0 a 1)
      else: [T: "intervalo abierto por la derecha"]      # phrase(el 'intervalo abierto por la derecha' de 0 a 1)
  - test:
      if: "$Verbosity!='Terse'"
      then:
      - T: "de extremos"      # phrase(el intervalo cerrado 'de extremos' 0 y 1), como el CMU
      - x: "*[1]"
      - T: "y"
      - x: "*[2]"
      else:
      - x: "*[1]"
      - T: "coma"
      - x: "*[2]"

- name: default-point
  tag: point
  match: "count(*)=2"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then:
      - T: "el"
  - T: "punto"
  - x: "*[1]"
  - T: "coma"
  - x: "*[2]"

# en español el artículo concuerda con el operador: "la suma", "la integral", "el producto"
- name: bigop-both
  tag: large-op
  match: "count(*) = 3"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then_test:   # el producto, el coproducto; la suma, la integral, la unión…
        if: "*[1][.='∏' or .='∐' or .='⨀' or .='⨁' or .='⨂' or .='⨃' or .='⨄' or .='⨅' or .='⨆' or .='⨇' or .='⨈' or .='⨉']"
        then: [OT: "el"]      # phrase('el' producto de k)
        else: [OT: "la"]      # phrase('la' suma de i)
  - x: "*[1]"
  - T: "desde"      # phrase(la suma 'desde' i igual a 1 hasta n)
  - x: "*[2]"
  - pause: short
  - T: "hasta"      # phrase(la suma desde i igual a 1 'hasta' n)
  - x: "*[3]"
  - test:
      if: "following-sibling::*"
      then: [T: "de"]      # phrase(la suma desde 1 hasta n 'de' i)

- name: bigop-under
  tag: large-op
  match: "count(*)=2"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then_test:   # el producto, el coproducto; la suma, la integral, la unión…
        if: "*[1][.='∏' or .='∐' or .='⨀' or .='⨁' or .='⨂' or .='⨃' or .='⨄' or .='⨅' or .='⨆' or .='⨇' or .='⨈' or .='⨉']"
        then: [OT: "el"]      # phrase('el' producto de k)
        else: [OT: "la"]      # phrase('la' suma de i)
  - x: "*[1]"
  - T: "sobre"      # phrase(la suma 'sobre' i de a sub i)
  - x: "*[2]"
  - test:
      if: "following-sibling::*"
      then: [T: "de"]      # phrase(la suma sobre i 'de' a sub i)

- name: largeop
  tag: mrow
  match: "count(*)=2 and IsInDefinition(*[1], 'LargeOperators')"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then_test:   # el producto, el coproducto; la suma, la integral, la unión…
        if: "*[1][.='∏' or .='∐' or .='⨀' or .='⨁' or .='⨂' or .='⨃' or .='⨄' or .='⨅' or .='⨆' or .='⨇' or .='⨈' or .='⨉']"
        then: [OT: "el"]      # phrase('el' producto de k)
        else: [OT: "la"]      # phrase('la' suma de i)
  - x: "*[1]"
  - T: "de"      # phrase(la suma 'de' a sub i)
  - x: "*[2]"

- name: repeating-decimal
  tag: repeating-decimal
  match: "."
  replace:
  - x: "*[1]"
  - T: "con período"      # phrase(0,1 'con período' 6)
  - spell: "*[2]"

- name: msubsup-skip-super
  # handles single, double, etc., prime
  tag: [skip-super, say-super]
  match: "count(*)=3"
  replace:
  - x: "*[1]"
  - test:
      if: "$Verbosity='Verbose'"
      then: [T: "subíndice"]
      else: [T: "sub"]
  - x: "*[2]"
  - test:
      if: "not(IsNode(*[2],'leaf') and $Impairment = 'Blindness')"
      then:
      - test:
          if: "$Verbosity='Verbose'"
          then: [T: "fin de subíndice"]
          else: [T: "fin de sub"]
      - pause: short
      else_test:
          if: "*[2][self::m:mi]"   # need a pause in "x sub k prime" so the prime is not associated with the 'k'
          then: [pause: short]
  - test:
      if: "name(.)='say-super'"
      then_test:
        if: "$Verbosity='Verbose'"
        then: [T: "superíndice"]
        else: [T: "superíndice"]
  - x: "*[3]"
  - pause: short


# in terse mode, we just say "m" or "s", etc., not meters or seconds
- name: currency-symbol
  tag: [unit, mi, mo, mtext]
  variables:
  - CurrencyWord: "DefinitionValue(., 'Speech', 'CurrencySymbols')"
  match: "$CurrencyWord != '' and ../*[self::m:mn or self::m:mi or self::m:mtext or self::m:msub or self::m:msup or self::m:msubsup or self::m:power or self::m:indexed-by]"
  replace:
  - bookmark: "@id"
  - test:
      if: "UnitNumber(.) = 'one'"
      then: [x: "$CurrencyWord"]
      else: [x: "UnitPluralForm($CurrencyWord)"]

- name: unit-terse
  tag: unit
  match: "$Verbosity = 'Terse' and string-length(.)=1"
  replace:
  - bookmark: "@id"
  - spell: "text()"

# the order of matching is
# 1. does it match the base of an SI unit
# 2. does it match an English unit (if in an English language)
# 3. does it match an SI prefix followed by an SI that accepts SI prefixes
# Due to this order, some things like "ft" and "cd" mean "feet" vs "femto-tonnes" and "pints" vs "pico-tonnes"
- name: unit
  tag: unit
  match: "."
  variables:
    # If the coefficient is singular, we don't add the plural ending. Finding the coefficient is tricky
    # Normal case (A) "3m" (parents is mrow), but could also be (B) "3 m^2" (etc.). (parent is msup/mrow)
    # But it might be in a fraction as (C) "3 m/s" (parent is mfrac/mrow) or (D) "3 m^2/s^2" (parent is msup/mfrac/mrow)
    #   or even (E) {3 m^2}/s (parent is msup/mrow)
    # If in a fraction, only look in the numerator to find the coefficient
  - Prefix: "''"
  - Word: "''"  
  replace:
  - bookmark: "@id"
  - test:
    # is the whole string match a SI Unit without a prefix?
    - if: "DefinitionValue(., 'Speech', 'SIUnits') != ''"
      then:
      - set_variables: [Word: "DefinitionValue(., 'Speech', 'SIUnits')"]
    - else_if: "DefinitionValue(., 'Speech', 'UnitsWithoutPrefixes') != ''"
      then:
      - set_variables: [Word: "DefinitionValue(., 'Speech', 'UnitsWithoutPrefixes')"]
    - else_if: "DefinitionValue(., 'Speech', 'EnglishUnits') != ''"
      then:
      - set_variables: [Word: "DefinitionValue(., 'Speech', 'EnglishUnits')"]
    - else_if: "DefinitionValue(., 'Speech', 'CurrencySymbols') != ''"
      then:
      - set_variables: [Word: "DefinitionValue(., 'Speech', 'CurrencySymbols')"]

    # do the first two chars match "da" and the remainder match an SIUnit
    - else_if: "string-length(.) >= 3 and 
                substring(., 1, 2) = 'da' and
                DefinitionValue(substring(., 3), 'Speech', 'SIUnits') != ''"
      then:
      - set_variables:
        - Prefix: "DefinitionValue('da', 'Speech', 'SIPrefixes')"
        - Word: "DefinitionValue(substring(., 3), 'Speech', 'SIUnits')"

    # does the first char match a prefix and the remainder match an SIUnit
    - else_if: "string-length(.) >= 2 and 
                DefinitionValue(substring(., 1, 1), 'Speech', 'SIPrefixes') != ''  and
                DefinitionValue(substring(., 2), 'Speech', 'SIUnits') != ''"
      then:
      - set_variables:
        - Prefix: "DefinitionValue(substring(., 1, 1), 'Speech', 'SIPrefixes')"
        - Word: "DefinitionValue(substring(., 2), 'Speech', 'SIUnits')"

    # not a known unit -- just speak the text, possibly as a plural
    # (string(): UnitPluralForm needs a string, not the text node)
    - else:
      - set_variables:
        - Word: "string(.)"

  # un millón de metros (millones exactos llevan "de")
  - test:
      if: "UnitNumber(.) != 'one' and GetQuantity(.)[not(contains(., $DecimalSeparators))] and count(GetUnit(GetQuantity(.)) | .) = 1 and number(translate(GetQuantity(.), ' .\u00A0\u202F\u2009', '')) >= 1000000 and number(translate(GetQuantity(.), ' .\u00A0\u202F\u2009', '')) mod 1000000 = 0"
      then: [T: "de"]
  # PluralForms first, else PluralDefaultFromEnding / PluralSpellingDefaultSuffix
  - test:
      if: "$Prefix = ''"
      then:
      - test:
        - if: "UnitNumber(.) = 'one' or ancestor::*[preceding-sibling::*[1][self::m:mo][.='/']]"
          then: [x: "$Word"]
          else: [x: "UnitPluralForm($Word)"]
      else:
      - x: "$Prefix"
      - test:
        - if: "UnitNumber(.) = 'one' or ancestor::*[preceding-sibling::*[1][self::m:mo][.='/']]"
          then: [x: "concat('\uF8FE', $Word)"]
          else: [x: "concat('\uF8FE', UnitPluralForm($Word))"]

# need to reverse the order of speech: $ 3 -> 3 dólares
- name: un-grado
  # "un grado", "un grado Celsius": el 1 no ve una unidad delante (° o °C con superíndice previo)
  tag: mn
  match:
  - ".='1' and following-sibling::*[not(self::m:mo and .='\u2062')][1]["
  - "  (self::m:mo or self::m:mi) and (.='°' or .='℃' or .='℉' or (.='′' or .='″') and ../preceding-sibling::*[.//*[.='°']]) or"
  - "  (self::m:mmultiscripts | self::*[count(*)=1]/m:mmultiscripts)[*[2][self::m:mprescripts] and *[4][.='°' or .='∘']]]"
  replace:
  - bookmark: "@id"
  - T: "un"      # phrase('un' grado Celsius)

- name: un-grado-celsius-simbolo
  # ℃ y ℉ después de 1: "un grado Celsius" (unicode.yaml los lee en plural)
  tag: [mo, mi]
  match: "(.='℃' or .='℉') and preceding-sibling::*[not(self::m:mo and .='\u2062')][1][self::m:mn][.='1']"
  replace:
  - test:
      if: ".='℃'"
      then: [T: "grado Celsius"]      # phrase(un 'grado Celsius')
      else: [T: "grado Fahrenheit"]      # phrase(un 'grado Fahrenheit')

- name: grados-celsius-prescrito
  # 25\,{}^{\circ}\mathrm{C} llega como C con un superíndice previo: "25 grados Celsius" (CMU)
  tag: mmultiscripts
  match:
  - "count(*)=4 and *[1][self::m:mi or self::m:unit][.='C' or .='F'] and *[2][self::m:mprescripts] and *[3][self::m:none] and"
  - "*[4][.='°' or .='∘'] and not(ancestor-or-self::*[contains(@data-intent-property, ':literal:')])"
  variables:
  - Numero: "preceding-sibling::*[1][.='\u2062']/preceding-sibling::*[1][self::m:mn] |
             parent::m:mrow[count(*)=1]/preceding-sibling::*[1][.='\u2062']/preceding-sibling::*[1][self::m:mn]"
  replace:
  - test:
      if: "$Numero = 1"
      then: [T: "grado"]      # phrase(1 'grado' Celsius)
      else: [T: "grados"]      # phrase(25 'grados' Celsius)
  - test:
      if: "*[1]='C'"
      then: [T: "Celsius"]      # phrase(25 grados 'Celsius')
      else: [T: "Fahrenheit"]      # phrase(25 grados 'Fahrenheit')

- name: currency
  tag: mrow
  variables:
  - CurrencyWord: "DefinitionValue(*[1], 'Speech', 'CurrencySymbols')"
  match: "count(*)=3 and $CurrencyWord != '' and *[3][self::m:mn or self::m:mi or self::m:mtext or self::m:msub or self::m:msup or self::m:msubsup or self::m:power or self::m:indexed-by]"
  replace:
  - bookmark: "*[3]/@id"
  - x: "*[3]"
  - x: "*[2]"   # visit silent invisible times so MoveNext can mark/skip it
  - test:
      if: "*[3][self::m:mn] and not(contains(*[3], $DecimalSeparators)) and number(translate(*[3], ' .\u00A0\u202F\u2009', '')) >= 1000000 and number(translate(*[3], ' .\u00A0\u202F\u2009', '')) mod 1000000 = 0"
      then: [T: "de"]
  - bookmark: "*[1]/@id"
  - x: "*[1]"

- name: sin
  tag: mi
  match: ".='sin' or .='sen'"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "sen"]
      else: [T: "seno"]

- name: cos
  tag: mi
  match: ".='cos'"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "cos"]
