  match: ".='sin' or .='sen'"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "sen"]
      else: [T: "seno"]

- name: cos
  tag: mi
  match: ".='cos'"
  replace:
  - bookmark: "@id"
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "cos"]
      else: [T: "coseno"]

- name: tan
  tag: mi
  match: ".='tan' or .='tg'"
