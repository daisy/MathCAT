---

- name: divergence
  tag: divergence
  match: "count(*) = 1"
  replace:
  # CORREÇÃO: a polaridade estava invertida — o modo padrão (Medium) ouvia a
  # abreviação "div"; o nome completo só saía no Verbose. No inglês, só o
  # Terse abrevia. E o "de" era incondicional, contrariando TerseFunctionNames
  # (divergence/curl/gradient não dizem "de" no modo conciso).
  - test:
      if: "$Verbosity='Terse'"
      then: [T: "div"]
      else: [T: "divergente de"]
  - test:
      if: "not(IsNode(*[1], 'leaf'))"
      then: [pause: short]
  - x: "*[1]"

- name: curl
  tag: curl
  match: "count(*) = 1"
  replace:
  - T: "rotacional"      # phrase(the 'curl of' a field)
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: "de"]
  - test:
      if: "not(IsNode(*[1], 'leaf'))"
      then: [pause: short]
  - x: "*[1]"

- name: gradient
  tag: gradient
  match: "count(*) = 1"
  replace:
  - test:
      if: "$Verbosity!='Terse'"
      then: [T: "gradiente de"]      # phrase('divergence' from the mean)
      else: [T: "nabla"]      # phrase('divergence' from the mean)
  - test:
      if: "not(IsNode(*[1], 'leaf'))"
      then: [pause: short]
  - x: "*[1]"


- name: laplacian
  tag: laplacian
  match: "count(*) <= 1"   # can be on ∇^2 or on enclosing mrow
  replace:
  - T: "laplaciano"
  - test:
      if: "count(*) = 1"
      then:
      - test:
          if: "$Verbosity!='Terse'"
          then: [T: "de"]
      - test:
          if: "not(IsNode(*[1], 'leaf'))"
          then: [pause: short]
      - x: "*[1]"
