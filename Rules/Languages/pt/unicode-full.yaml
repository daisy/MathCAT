# DECISÃO (consultoria de acessibilidade matemática): falar o VALOR, não a
# grafia. Soletrar "I V" descreve como o algarismo é escrito; quem ouve
# precisa do número. Divergimos aqui do inglês, que ainda soletra ("I V").
# Vale só para estes caracteres Unicode dedicados, cuja semântica de numeral
