# Ordem das palavras: ao contrário do inglês, que antepõe o estilo
# ("fraktur cap a"), o português pospõe o adjetivo ("maiúscula a vazado").
# Por isso o `spell:` vem ANTES da palavra de estilo nos blocos de alfabeto.
# Isso segue a expectativa já registrada em tests/Languages/pt/alphabets.rs
# ("maiúscula delta vazado").


