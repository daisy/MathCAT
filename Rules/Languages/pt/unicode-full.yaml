 - "Ⅎ℺⅁⅂⅃⅄":        # 0x2132, 0x213a, 0x2141, 0x2142, 0x2143, 0x2144 
    - test:
      - if: "'.' = '℺'"
        then: [t: "rotated"]
      - else_if: "'.' = 'Ⅎ'"
        then: [T: "invertido"]
      - else_if: "'.' = '⅃'"
        then: [t: "reversed sans-serif"]
        else: [T: "invertido sem serifa"]
    - spell: "translate('.', 'Ⅎ℺⅁⅂⅃⅄', 'FQGLLY')"
