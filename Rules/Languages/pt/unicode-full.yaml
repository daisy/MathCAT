# ============================================================================
# ACRESCENTADO nesta rodada — faixas de maior impacto pedagógico.
# Traduzido a partir do INGLÊS, linha a linha (nunca do espanhol).
#
# Convenção de marcação usada aqui:
#   T:  o termo é o padrão inequívoco do português matemático, ou segue
#       decisão já tomada neste repositório.
#   t:  houve escolha entre alternativas defensáveis; falta conferência de
#       falante nativo. Os pontos em aberto estão listados no ACHADOS.md.
#
# Ordem das palavras: ao contrário do inglês, que antepõe o estilo
# ("fraktur cap a"), o português pospõe o adjetivo ("maiúscula a vazado").
# Por isso o `spell:` vem ANTES da palavra de estilo nos blocos de alfabeto.
# Isso segue a expectativa já registrada em tests/Languages/pt/alphabets.rs
# ("maiúscula delta vazado").
# ============================================================================

