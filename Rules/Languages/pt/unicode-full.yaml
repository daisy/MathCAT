 - "⟺": [T: "se e somente se"]               # 0x27fa (en: 'if and only if')

# Barra sobre variável: \bar{x}, \overline{x}. O motor canonicaliza U+0304 e
# U+203E para U+00AF, então a entrada "̄" (com mácron) do unicode.yaml nunca
# era alcançada em <mover>. "x barra" é a leitura corrente (média amostral).
 - "¯":                                       # 0xaf
     - test:
        if: "ancestor::m:modified-variable and preceding-sibling::*[1][self::m:mi]"
        then: [T: "barra"]                    #  (en: 'bar')
        else: [T: "linha superior"]           #  (en: 'line')

# Sinais "letterlike" que aparecem soltos (fora de unidade, onde definitions.yaml
# já resolve): a leitura é a da letra, não a do prefixo.
 - "µ": [T: "mi"]                             # 0xb5 MICRO SIGN — como letra; "micro" só dentro de unidade
 - "Ω": [T: "ômega"]                          # 0x2126 OHM SIGN — espaço amostral, etc.
 - "℧": [T: "mho"]                            # 0x2127
 - "Å": [T: "angstrom"]                       # 0xc5
 - "Å": [T: "angstrom"]                       # 0x212b

# ==== RECUO CONTROLADO (gerado por PythonScripts/gerar_recuo_en.py) ====
# Entradas copiadas de en/unicode-full.yaml para codepoints que o português
# ainda não cobria. Sem elas o caractere saía CRU para o sintetizador (ver
# ACHADOS 9.2). `T:` maiúsculo = reaproveitou tradução ou termo já definido;
# `t:` minúsculo = ainda em inglês. Toda entrada aqui leva a marca # RECUO-EN
