 - "⟨": [T: "abre colchete angular"]         # 0x27e8 (en: 'left angle bracket')
 - "⟩": [T: "fecha colchete angular"]        # 0x27e9
 - "⟪": [T: "abre colchete angular duplo"]   # 0x27ea
 - "⟫": [T: "fecha colchete angular duplo"]  # 0x27eb
 - "⟵": [T: "seta longa para a esquerda"]    # 0x27f5
 - "⟶": [T: "seta longa para a direita"]     # 0x27f6 (em química a regra de reação fala "reage formando" antes de chegar aqui)
 - "⟷": [T: "seta longa para a esquerda e para a direita"] # 0x27f7
 - "⟸": [T: "seta dupla longa para a esquerda"] # 0x27f8
