---
# Provide an overview/outline/description of the math
# MathPlayer just tried to shorten things like "mfrac" by just saying "fraction"
#   For mrow, it say up to 5 operands and just say "and n more things" for the rest
# This results in strings of varying length. Given human memory is about 7 words long,
#   it would be better to aim for 7 words (maybe aim for a range of 6-10 words).
# Idea:
#   Start by generating a terse form of the speech
#   At every step when the strings are being joined
#     a) if the #words <= 7, return the joined string
#     b) otherwise, set verbosity to 'overview' and regenerate the expression and use that
# There is a balance that you want to maximize the info given, so 10 words is likely better then 3.
#   That might mean that at the top level, we may want to allow the first few children to expand


- name: overview-default
  tag: [fraction, mfrac]   
  match: "."
  replace:
  - test:
      if: "IsNode(*[1], 'simple') and IsNode(*[2], 'simple')"
      then:
      - x: "*[1]"
      - T: "sobre"
      - x: "*[2]"
      else:
      - T: "fração"

- name: overview-default
  tag: [msqrt, "square-root"]   # CORREÇÃO: idem
  match: "."
  replace:
  - T: "raiz quadrada"
  - test:
      if: "IsNode(*[1], 'simple')"
      then:
      - test:
          if: "$Verbosity!='Terse'"
          then: [T: de]
      - x: "*[1]"

- name: overview-default
  tag: [mroot, root]   # CORREÇÃO: idem
  match: "."
  replace:
  - test:
      if: "*[2][self::m:mn]"
      then_test:
      - if: "*[2][.='2']"
        then: [T: raiz quadrada]
      - else_if: "*[2][.='3']"
        then: [T: raiz cúbica]
      - else_if: "*[2][not(contains(., '.'))]"
        then: [T: raiz, T: de índice, x: "*[2]"]
      else:
      # índice simbólico (ex.: raiz de índice n) — em português a ordem natural
      # é "raiz de índice n", diferente do inglês "n-th root".
      - T: raiz
      - T: de índice
      - x: "*[2]"
  - test:
      if: "IsNode(*[1], 'simple')"
      then:
      - test:
          if: "$Verbosity!='Terse'"
          then: [T: de]
      - x: "*[1]"

- name: matrix-override
  tag: mrow
  match:
  - "*[2][self::m:mtable] and"
  - "(IsBracketed(., '(', ')') or IsBracketed(., '[', ']') or IsBracketed(., '|', '|'))"
  replace:
  # CORREÇÃO: a ordem herdada do inglês ("the 2 by 3 matrix") produzia
  # "a 2 por 3 matriz". Em português o substantivo vem antes da dimensão.
  - test:
      if: "*[1][.='|']" # just need to check the first bracket since we know it must be (, [, or |
      then: [T: determinante]
      else: [T: matriz]
  - x: count(*[2]/*)
  - T: por
  - x: count(*[2]/*[self::m:mtr][1]/*)

- name: overview-default
  tag: mtable
  match: "."
  replace:
  # CORREÇÃO: mesma inversão de ordem do bloco acima.
  - T: "tabela"
  - x: count(*[2]/*)
  - T: por
  - x: count(*[2]/*[self::m:mtr][1]/*)

- name: short-mrow
  tag: mrow
  match: "count(*)<6"
  replace:
  - insert:
      nodes: "*"
      replace: [pause: auto]

- name: long-mrow
  tag: mrow
  match: "."
  replace:
  - x: "*[1]"
  - pause: auto
  - x: "*[2]"
  - pause: auto
  - x: "*[3]"
  - pause: auto
  - x: "*[4]"
  - pause: auto
  - x: "*[5]"
  - pause: auto
  - T: "etc."

- include: "SimpleSpeak_Rules.yaml"
