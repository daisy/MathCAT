     - test: 
         if: "$Verbosity!='Terse'"
         then: [T: "é"]                         #  (en: 'is', google translation)
     - T: "mais positivo"               #  (en: 'most positive')
 - "≠":                                          #  0x2260
     - test: 
         if: "$Verbosity!='Terse'"
         then: [T: ""]                          #  ("diferente de" já dispensa a cópula)
     - T: "diferente de"                         #  (en: 'not equal to'; MathPlayer sugeria 'distinto de' e o algoritmo escolheu a do Google)
 - "≡":                                          #  0x2261
     - test: 
         if: "$Verbosity!='Terse'"
         then: [T: "é"]                         #  (en: 'is', google translation)
