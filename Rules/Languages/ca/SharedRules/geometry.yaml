---

- name: line-segment
  tag: line-segment
  match: "count(*)=2"
  replace:
  - test:
      if: "$Verbosity='Verbose'"
      then:
      - t: "el segment de recta des de"      # phrase('the line segment from' A to B)
      - x: "*[1]"
      - t: "fins a"                         # phrase(the line segment from A 'to' B)
      - x: "*[2]"
      else:
      - t: "segment de recta"               # phrase(the 'line segment' A  B)
      - x: "*[1]"
      - x: "*[2]"

- name: geometry-ray
  tag: ray
  match: "count(*)=2"
  replace:
  - test:
      if: "$Verbosity='Verbose'"
      then:
      - t: "la semirecta des de"             # phrase('the ray from' A to B)
      - x: "*[1]"
      - t: "fins a"                       # phrase(the ray from A 'to' B)
      - x: "*[2]"
      else:
      - t: "semirecta"                      # phrase(the 'ray'A  B)
      - x: "*[1]"
      - x: "*[2]"

- name: geometry-arc
  tag: arc
  match: "count(*)=2"
  replace:
  - test:
      if: "$Verbosity='Verbose'"
      then: [ot: "l'"]            # phrase('the' arc A B C)
  - t: "arc"                        # phrase(the 'arc' A B C)
  - x: "*[1]"
  - x: "*[2]"

- name: measure-of-angle
  tag: measure-of-angle
  match: "count(*)=3"
  replace:
  - test:
      if: "$Verbosity='Verbose'"
      then:
      - t: "la mesura de l'angle"      # phrase('the measure of the angle' ABC)
      else:
      - t: "mesura de l'angle"      # phrase('measure of angle' ABC)
  - x: "*[1]"
  - x: "*[2]"
  - x: "*[3]"


- name: coordinate
  tag: coordinate
  match: "."
  replace:
  - test:
      if: "$Verbosity='Verbose'"
      then: [ot: "el"]      # phrase('the' point at 1, 2)
  - t: "punt"      # phrase(the 'point' at 1, 2)
  - test:
      if: "$Verbosity='Verbose'"
      then: [t: "a"]      # phrase('the' point at 1, 2)
  - pause: short
  - insert:
      nodes: "*"
      replace: [t: "coma", pause: auto]      # phrase(f of x 'comma' y)
  - pause: short
  - test:
      if: "($SpeechStyle='ClearSpeak' and $Verbosity='Verbose') or not(IsNode(*[last()],'leaf'))"
      then: [t: "fi del punt"]      # phrase(start point, 'end point')
