---

- name: scalar-determinant
  tag: determinant
  match: "count(*)=1 and not(*[1][self::m:mtr])"
  replace:
  - T: "определитель"      # phrase(the 'determinant' of a matrix)
  - x: "*[1]"
  - test:
      if: "not(IsNode(*[1], 'simple')) and $Impairment = 'Blindness'"
      then: [T: "конец определителя"]      # phrase('end determinant' of a matrix)


- name: subscripted-norm
  tag: subscripted-norm
  match: "count(*)=2"
  replace:
  - T: "норма"      # phrase(the 'norm' can be a measure of distance)
  - x: "*[1]"
  - T: "с индексом"
  - x: "*[2]"

- name: transpose
  tag: transpose
  match: "count(*)=1"
  replace:
  - T: "транспонированная матрица"
  - test:
      if: "*[1][self::m:mi and string-length(.)=1 and contains('ABCDEFGHIJKLMNOPQRSTUVWXYZ', .)]"
      then: [x: "translate(*[1], 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz')"]
      else: [x: "*[1]"]
