"Q": "кветта", "R": "ронна", "Y": "иотта", "Z": "зетта", "E": "экса", "P": "пета", "T": "тера", "G": "гига", "M": "мега", "k": "кило", "h": "гекто", "da": "дека",
    "d": "деци", "c": "санти", "m": "милли", "µ": "микро", "n": "нано", "p": "пико", "f": "фемто", "a": "атто", "z": "зепто", "y": "иокто", "r": "ронто", "q": "квекто"
  }

# Units that accept SI prefixes (symbol → spoken singular base word).
# this is a list of all units that accept SIPrefixes
# from www.bipm.org/documents/20126/41483022/SI-Brochure-9-EN.pdf
#   Prefixes may be used with any of the 29 SI units with special names
#   The SI prefixes can be used with several of accepted units, but not, for example, with the non-SI units of time.
- SIUnits: {
    # base units
    "A": "ампер",
    "cd": "кандела",
    "K": "кельвин", "K": "кельвин", # U+212A
    "g": "грамм",
    "m": "метр",
    "mol": "моль",
    "s": "секунда", "sec": "секунда",  # "sec" is a supported alias; the SI symbol is "s"

    # derived units
    "Bq": "беккерель",
    "C": "кулон",
    "°C": "градус Цельсия", "℃": "градус Цельсия", # SI prefixes also apply to degrees Celsius (SI Brochure, section 3)
    "F": "фарад",
    "Gy": "грей",
    "H": "генри",
    "Hz": "герц",
    "J": "джоуль",
    "kat": "катал",
    "lm": "люмен",
    "lx": "люкс",
    "N": "ньютон",
    "Ω": "ом", "Ω": "ом",       # Greek capital omega and U+2126 OHM SIGN
    "Pa": "паскаль",
    "S": "сименс",
    "Sv": "зиверт",
    "T": "тесла",
    "V": "вольт",
    "W": "ватт",
    "Wb": "вебер",

    # accepted (plus a few variants) that take SI prefixes
    "l": "литр", "L": "литр", "ℓ": "литр",  # Both "l" and "L" are accepted symbols; the script form is also supported
    "t": "тонна",           # SI prefixes are accepted with the tonne
    "Da": "дальтон",
    "Np": "непер",               # Logarithmic ratio unit
    "u": "атомная единица массы",     # 'u' is an accepted symbol for the unified atomic mass unit
    "eV": "электронвольт",
    "rad": "радиан",             # SI unit of plane angle
    "sr": "стерадиан",          # SI unit of solid angle
  
    # others that take a prefix
    "a": "год",               # Supported symbol for year
    "as": "угловая секунда",          # Supported alias for arcsecond

    # technically wrong, but used in practice with SI Units
    "b": "бит",               # Supported information unit
    "B": "байт",              # Supported information unit
    "Bd": "бод",              # Supported symbol for baud
  }


